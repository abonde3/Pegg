<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Pegg — Bar Stock &amp; Settlement</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#18140F">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#18140F; --panel:#231D16; --panel-2:#2B241B; --line:#3B3125;
    --text:#EFE7D8; --text-dim:#A99C87; --accent:#C98A3E; --accent-soft:#3A2B18;
    --good:#5FA779; --good-soft:#20301F; --bad:#C4695A; --bad-soft:#341F1B;
    --warn:#D9AE4E; --warn-soft:#332B18; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overflow-x:hidden; width:100%;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; margin:0; letter-spacing:0.2px; }
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums;}
  #app{display:flex; min-height:100vh; width:100%; max-width:100vw;}

  #sidebar{ width:220px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); padding:22px 14px; display:flex; flex-direction:column; gap:4px; }
  #sidebar .brand{ font-family:'Fraunces',serif; font-size:20px; font-weight:700; color:var(--accent); margin-bottom:18px; padding:0 8px; }
  #sidebar .brand span{display:block; font-family:'Inter'; font-size:11px; color:var(--text-dim); font-weight:400; margin-top:2px;}
  .navbtn{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer; color:var(--text-dim); font-size:14px; font-weight:500; border:none; background:transparent; text-align:left; width:100%; }
  .navbtn:hover{background:var(--panel-2); color:var(--text);}
  .navbtn.active{background:var(--accent-soft); color:var(--accent);}
  .navbtn .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6;flex-shrink:0;}
  .sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--line);}
  .who{font-size:12px; color:var(--text-dim); padding:0 8px 8px;}
  .who b{color:var(--text); font-weight:600;}
  .who .role{color:var(--accent); font-size:11px;}

  main{flex:1; min-width:0; padding:0 32px 100px; max-width:1000px; width:100%;}
  .topbar{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:16px 0 0; flex-wrap:wrap; }
  .topbar .who-inline{font-size:12.5px; color:var(--text-dim);}
  .topbar .who-inline b{color:var(--text);}
  .biz-date-pill{font-size:11.5px; background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim); padding:4px 10px; border-radius:20px;}
  .pagehead{margin:18px 0 22px;}
  .pagehead h1{font-size:26px;}
  .pagehead p{color:var(--text-dim); margin-top:4px; font-size:14px;}
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; max-width:100%; overflow:hidden; }
  .card h3{font-size:15px; margin-bottom:12px; color:var(--text);}
  .row{display:flex; gap:14px; flex-wrap:wrap;}
  .stat{flex:1; min-width:140px;}
  .stat .label{font-size:12px; color:var(--text-dim);}
  .stat .value{font-family:'Fraunces',serif; font-size:24px; margin-top:4px; word-break:break-word;}
  .stat .value.good{color:var(--good);} .stat .value.bad{color:var(--bad);} .stat .value.warn{color:var(--warn);}

  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{ text-align:left; padding:8px 10px; font-size:11.5px; color:var(--text-dim); border-bottom:1px solid var(--line); font-weight:600; }
  td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right; font-family:'IBM Plex Mono',monospace;}
  .tablewrap{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;}

  input[type=text], input[type=number], input[type=date], input[type=password], select{
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:11px 10px; border-radius:7px; font-size:15px; width:100%;
    font-family:'Inter',sans-serif; min-height:44px;
  }
  input[type=number]{font-family:'IBM Plex Mono',monospace;}
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  input[type=password]{font-family:'IBM Plex Mono',monospace; letter-spacing:2px;}
  input:focus, select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  label{font-size:12px; color:var(--text-dim); display:block; margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end;}

  button.btn{ background:var(--accent); color:#20160A; border:none; padding:12px 18px; border-radius:8px; font-weight:600; font-size:14.5px; cursor:pointer; min-height:44px; }
  button.btn:hover{filter:brightness(1.08);}
  button.btn.secondary{background:var(--panel-2); color:var(--text); border:1px solid var(--line);}
  button.btn.danger{background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad);}
  button.btn:disabled{opacity:.4; cursor:not-allowed;}
  button.iconbtn{ background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:13.5px; padding:8px 10px; min-height:38px; }
  button.iconbtn:hover{color:var(--accent);}
  button.iconbtn.danger{color:var(--bad);}

  .badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:12px; font-weight:600;}
  .badge.good{background:var(--good-soft); color:var(--good);}
  .badge.bad{background:var(--bad-soft); color:var(--bad);}
  .badge.warn{background:var(--warn-soft); color:var(--warn);}
  .badge.neutral{background:var(--panel-2); color:var(--text-dim);}
  .empty{color:var(--text-dim); font-size:14px; padding:20px 4px; text-align:center;}

  .overlay{ position:fixed; inset:0; background:rgba(10,8,5,.6); display:flex; align-items:center; justify-content:center; z-index:50; padding:12px; }
  .modal{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; width:100%; max-width:460px; max-height:88vh; overflow:auto; }
  .modal h3{margin-bottom:16px;}
  .modal .actions{display:flex; justify-content:flex-end; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .modal .actions button{flex:1; min-width:120px;}

  .toast{ position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:8px; font-size:13px; z-index:100; box-shadow:0 6px 18px rgba(0,0,0,.35); max-width:90vw; text-align:center; }

  .authwrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .authcard{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:32px 28px; width:100%; max-width:380px; }
  .authcard .brand{ font-family:'Fraunces',serif; font-size:24px; font-weight:700; color:var(--accent); margin-bottom:4px; }
  .authcard .sub{color:var(--text-dim); font-size:13px; margin-bottom:22px;}
  .authcard .err{color:var(--bad); font-size:13px; margin-top:4px; min-height:16px;}
  .userlist{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .userpick{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border:1px solid var(--line); border-radius:8px; cursor:pointer; background:var(--bg); min-height:44px; }
  .userpick:hover{border-color:var(--accent);}
  .userpick .name{font-size:14px;}
  .userpick .role{font-size:11px; color:var(--text-dim);}

  .creditrow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; align-items:center;}
  .creditrow > *{flex:1; min-width:110px;}
  .creditrow button{flex:0 0 auto; min-width:38px;}

  .listrow{display:flex; justify-content:space-between; align-items:center; padding:14px 10px; border-bottom:1px solid var(--line); cursor:pointer; min-height:48px;}
  .listrow:last-child{border-bottom:none;}
  .listrow-title{font-size:14.5px;}
  .listrow-sub{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .listrow .chev{color:var(--text-dim); font-size:18px; flex-shrink:0; margin-left:10px;}
  .detailrow{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .detailrow:last-of-type{border-bottom:none;}
  .navicon{font-size:19px; line-height:1;}
  .segctl{display:flex; gap:8px; margin-bottom:16px;}
  .segctl button{flex:1;}

  /* Mobile card tables */
  @media (max-width: 820px){
    table.mobile-cards thead{display:none;}
    table.mobile-cards, table.mobile-cards tbody{display:block; width:100%;}
    table.mobile-cards tr{
      display:block; border:1px solid var(--line); border-radius:10px;
      padding:6px 12px; margin-bottom:10px; background:var(--panel-2);
    }
    table.mobile-cards td{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      border:none; padding:8px 0; text-align:right;
    }
    table.mobile-cards td::before{
      content:attr(data-label); color:var(--text-dim); font-size:11.5px; font-weight:600;
      text-align:left; margin-right:auto;
    }
    table.mobile-cards td > input, table.mobile-cards td > select{ max-width:150px; }
  }

  #bottomnav{display:none;}
  @media (max-width: 820px){
    #sidebar{display:none;}
    main{padding:0 12px 100px;}
    .topbar{padding-top:10px;}
    #bottomnav{
      display:flex; position:fixed; bottom:0; left:0; right:0; height:66px;
      background:var(--panel); border-top:1px solid var(--line);
      z-index:40; padding:0 2px;
    }
    #bottomnav button{
      flex:1 1 0; min-width:0; background:none; border:none; color:var(--text-dim);
      font-size:11px; padding:8px 2px 10px; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:3px; cursor:pointer; min-height:58px;
    }
    #bottomnav button .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7;}
    #bottomnav button.active{color:var(--accent);}
    .row{flex-direction:column;} .grid2{grid-template-columns:1fr;} .grid3{grid-template-columns:1fr;}
    .card{padding:16px 14px;}
    .modal{padding:16px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
  "use strict";

  // ====== Supabase project ======
  const SUPABASE_URL = "https://atuplufrgsbkuhzisdng.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0dXBsdWZyZ3Nia3VoemlzZG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzM2OTcsImV4cCI6MjEwNDU0OTY5N30.7hr-dzj9yULzFuG9egWQJns3t184s9e7HDzZDY7HB90";
  // ================================

  const NOT_CONFIGURED = SUPABASE_URL.includes('YOUR_') || SUPABASE_ANON_KEY.includes('YOUR_');
  const sb = NOT_CONFIGURED ? null : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const BUSINESS_DAY_CUTOFF_HOUR = 6; // business day runs until this hour the next morning
  const CURRENT_BAR_KEY = 'pegg.currentBarId';

  const ALL_TABS = [
    {id:'dashboard', label:'Dashboard', roles:['owner','manager']},
    {id:'products', label:'Products', roles:['owner']},
    {id:'inventory', label:'Inventory', roles:['owner','manager']},
    {id:'transfer', label:'Transfer', roles:['owner','manager']},
    {id:'closing', label:'Closing', roles:['owner','manager']},
    {id:'credit', label:'Credit', roles:['owner','manager']},
    {id:'reports', label:'Reports', roles:['owner']},
    {id:'users', label:'Users', roles:['owner']},
  ];

  let state = {
    products: [], history: [], draft: null,
    creditUsers: [], creditTransactions: [],
    transferBatches: [],
    authUser: null,       // {id, email} from Supabase Auth — null until signed in
    myBars: [],           // [{bar_id, bar_name, role, active}] — bars this user belongs to
    currentBar: null,     // {bar_id, bar_name, role} — the bar currently being operated on
    isSuperAdmin: false,
    showSuperAdminPanel: false,
    authScreen: 'login',  // 'login' | 'signup'
    tab: 'dashboard', loading: true,
    transferWizard: null, // {step:'entering'|'review', qtys:{}}
    inventorySubTab: 'main',
    productSearch: '', creditSearch: '',
    reportsView: null,
    moreSheetOpen: false
  };
  let draftSaveTimer = null;

  function isMobile(){ return window.innerWidth <= 820; }

  // ---------- inactivity timeout (15 min, warn at 13 min) ----------
  // Uses a wall-clock timestamp (checked periodically + on tab-visible) rather than
  // relying solely on setTimeout, because mobile browsers throttle/suspend timers
  // in backgrounded tabs — a plain setTimeout can fire late (or effectively never
  // until the user returns), which is why the previous version could stay logged
  // in past 15 minutes.
  const INACTIVITY_KEY = 'pegg.lastActivityAt';
  const INACTIVITY_WARNING_MS = 13*60*1000;
  const INACTIVITY_LIMIT_MS = 15*60*1000;
  let inactivityCheckInterval = null;
  let warnedThisIdlePeriod = false;
  let lastActivityMarkThrottle = 0;

  function markActivity(){
    if(!state.authUser) return;
    warnedThisIdlePeriod = false;
    try{ localStorage.setItem(INACTIVITY_KEY, String(Date.now())); }catch(e){}
  }
  function getLastActivityAt(){
    try{
      const v = localStorage.getItem(INACTIVITY_KEY);
      return v ? parseInt(v,10) : Date.now();
    }catch(e){ return Date.now(); }
  }
  function checkInactivity(){
    if(!state.authUser) return;
    const idleMs = Date.now() - getLastActivityAt();
    if(idleMs >= INACTIVITY_LIMIT_MS){
      stopInactivityWatch();
      toast('Signed out due to inactivity.');
      logout();
    } else if(idleMs >= INACTIVITY_WARNING_MS && !warnedThisIdlePeriod){
      warnedThisIdlePeriod = true;
      toast('Your session is about to expire due to inactivity.');
    }
  }
  function startInactivityWatch(){
    markActivity();
    stopInactivityWatch();
    inactivityCheckInterval = setInterval(checkInactivity, 15000);
  }
  function stopInactivityWatch(){
    if(inactivityCheckInterval) clearInterval(inactivityCheckInterval);
    inactivityCheckInterval = null;
  }
  function handleActivity(){
    if(!state.authUser) return;
    const now = Date.now();
    if(now - lastActivityMarkThrottle < 3000) return; // don't hammer localStorage
    lastActivityMarkThrottle = now;
    markActivity();
  }
  // Genuine interaction only — no mousemove/scroll, which can fire without real intent.
  ['click','keydown','touchstart','pointerdown'].forEach(evt=>{
    document.addEventListener(evt, handleActivity, {passive:true});
  });
  // Catches the case where the phone was locked/backgrounded for 15+ minutes:
  // check immediately the moment the tab becomes visible again, rather than
  // waiting on a possibly-delayed/suspended timer.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible' && state.authUser){ checkInactivity(); }
  });

  let resizeTimer=null;
  let lastIsMobile = isMobile();
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      const nowMobile = isMobile();
      if(nowMobile !== lastIsMobile){
        lastIsMobile = nowMobile;
        if(state.authUser) render();
      }
    }, 200);
  });

  // ---------- in-app back navigation (hardware/gesture Back button) ----------
  // Each drill-in (opening a detail modal, switching into an edit mode, moving to a
  // wizard step, etc.) pushes a synthetic history entry with a matching "undo"
  // callback. Both the hardware Back button (via popstate) and any in-app
  // Back/Cancel button go through the SAME goBackOneLevel() -> history.back() path,
  // so the two stay in sync and one Back press always undoes exactly one screen.
  let navBackStack = [];
  function pushNavLevel(onBack){
    navBackStack.push(onBack);
    try{ history.pushState({peggNav: navBackStack.length}, '', location.href); }catch(e){}
  }
  function goBackOneLevel(){
    if(navBackStack.length){ history.back(); }
  }
  window.addEventListener('popstate', ()=>{
    if(navBackStack.length){
      const fn = navBackStack.pop();
      if(fn) fn();
    }
  });

  // A main-tab switch (Home/Inventory/Transfer/Closing/Products/Credit/Reports/Users)
  // ensures exactly one pending "return to Home" back-level exists whenever the
  // current tab isn't Home — so the FIRST Back press from any main tab lands on
  // Home, no matter which non-Home tabs were visited in between. Any deeper
  // drill-down levels (opened afterwards) stack normally on top of this one, so
  // Back still unwinds those first, only reaching Home once they're exhausted.
  let homeBackPending = false;
  function ensureHomeBackLevel(){
    if(homeBackPending || state.tab==='dashboard') return;
    homeBackPending = true;
    pushNavLevel(()=>{ homeBackPending = false; state.tab = 'dashboard'; render(); });
  }
  function goToTab(tabId){
    navBackStack = [];
    homeBackPending = false;
    if(tabId==='reports') state.reportsView = null;
    state.tab = tabId;
    ensureHomeBackLevel();
    render();
  }

  // ---------- helpers ----------
  function fmt(n){ n = Number(n)||0; return '₹' + n.toLocaleString('en-IN', {maximumFractionDigits:2}); }
  function localISO(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
  function calendarDateISO(){ return localISO(new Date()); }
  function businessDateISO(date){
    const d = date ? new Date(date) : new Date();
    if(d.getHours() < BUSINESS_DAY_CUTOFF_HOUR){ d.setDate(d.getDate()-1); }
    return localISO(d);
  }
  function fmtDate(iso){
    if(!iso) return '—';
    const d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
  }
  function toast(msg){
    const root = document.getElementById('toastRoot');
    const el = document.createElement('div');
    el.className='toast'; el.textContent=msg;
    root.appendChild(el);
    setTimeout(()=>el.remove(), 2600);
  }
  function productById(id){ return state.products.find(p=>p.id===id); }
  function productLabel(p){ return p ? p.name + (p.size ? ' ' + p.size : '') : 'Unknown product'; }
  function hasBulkPricing(p){ return !!(p && p.bulk_enabled && Number(p.bulk_price) > 0); }
  function anyBulkPricingConfigured(){ return state.products.some(hasBulkPricing); }
  function findCreditUserByName(name){
    const norm = (name||'').trim().toLowerCase();
    if(!norm) return null;
    return state.creditUsers.find(u=>u.name.trim().toLowerCase()===norm) || null;
  }
  function showDuplicateUserConfirm(existingUser, onYes, onNo){
    document.getElementById('modalRoot').innerHTML = `
      <div class="overlay"><div class="modal">
        <h3>A user with this name already exists</h3>
        <p style="margin-bottom:6px;"><b>${existingUser.name}</b></p>
        <p>Is this the same person?</p>
        <div class="actions">
          <button class="btn secondary" id="dup_no">No, different person</button>
          <button class="btn" id="dup_yes">Yes, use existing user</button>
        </div>
      </div></div>`;
    document.getElementById('dup_yes').onclick = onYes;
    document.getElementById('dup_no').onclick = onNo;
  }
  function visibleTabs(){ return state.currentBar ? ALL_TABS.filter(t=>t.roles.includes(state.currentBar.role)) : []; }
  function roleLabel(role){ return role==='owner' ? 'Owner' : 'Manager'; }
  function creditUserById(id){ return state.creditUsers.find(u=>u.id===id); }
  function creditBalance(userId){
    let bal = 0;
    state.creditTransactions.filter(t=>t.credit_user_id===userId && t.status==='active').forEach(t=>{
      bal += t.type==='given' ? Number(t.amount) : -Number(t.amount);
    });
    return bal;
  }
  function totalOutstandingCredit(){
    return state.creditUsers.reduce((a,u)=>a+Math.max(0,creditBalance(u.id)),0);
  }
  function creditCollectedForDate(dateStr){
    const txs = state.creditTransactions.filter(t=>t.type==='repayment' && t.status==='active' && t.business_date===dateStr);
    const cash = txs.filter(t=>t.method==='cash').reduce((a,t)=>a+Number(t.amount),0);
    const upi = txs.filter(t=>t.method==='upi').reduce((a,t)=>a+Number(t.amount),0);
    return {cash, upi, total: cash+upi};
  }
  function closingEditableDate(dateStr){
    const laterClosingExists = state.history.some(h=>h.date > dateStr);
    const laterDraftExists = state.draft && state.draft.date > dateStr;
    return !laterClosingExists && !laterDraftExists;
  }

  // ---------- DATA LAYER ----------
  // ---------- AUTH + BAR CONTEXT ----------
  async function initApp(){
    const { data: { session } } = await sb.auth.getSession();
    if(session && session.user){
      state.authUser = { id: session.user.id, email: session.user.email };
      await afterAuthResolved();
    } else {
      state.authUser = null;
      state.loading = false;
      render();
    }
    sb.auth.onAuthStateChange((event)=>{
      if(event === 'SIGNED_OUT'){
        state.authUser = null; state.currentBar = null; state.myBars = []; state.isSuperAdmin = false;
        stopInactivityWatch();
        render();
      }
    });
  }

  async function afterAuthResolved(){
    await sb.rpc('accept_pending_invites'); // silently claims any invites matching this email
    const [{data: bars, error: barsErr}, {data: superAdmin}] = await Promise.all([
      sb.rpc('list_my_bars'),
      sb.rpc('is_super_admin')
    ]);
    if(barsErr){ console.error(barsErr); toast('Could not load your bars.'); }
    state.myBars = bars || [];
    state.isSuperAdmin = !!superAdmin;

    let savedBarId = null;
    try{ savedBarId = localStorage.getItem(CURRENT_BAR_KEY); }catch(e){}
    const activeBars = state.myBars.filter(b=>b.active);
    const match = activeBars.find(b=>b.bar_id === savedBarId);

    if(match){
      await selectBar(match);
    } else if(activeBars.length === 1){
      await selectBar(activeBars[0]);
    } else {
      state.currentBar = null;
      state.loading = false;
      render();
    }
  }

  async function selectBar(barEntry){
    state.currentBar = { bar_id: barEntry.bar_id, bar_name: barEntry.bar_name, role: barEntry.role };
    try{ localStorage.setItem(CURRENT_BAR_KEY, barEntry.bar_id); }catch(e){}
    state.tab = 'dashboard';
    navBackStack = []; homeBackPending = false;
    startInactivityWatch();
    await loadBarData();
  }

  async function loadBarData(){
    state.loading = true;
    const barId = state.currentBar.bar_id;
    const [
      {data: products, error: pErr},
      {data: closings, error: cErr},
      {data: draftRow, error: dErr},
      {data: creditUsers, error: cuErr},
      {data: creditTx, error: ctErr},
      {data: transferBatches, error: tbErr}
    ] = await Promise.all([
      sb.from('products').select('*').eq('bar_id', barId).eq('active', true).order('name'),
      sb.from('closings').select('*, closing_line_items(*)').eq('bar_id', barId).order('closing_date', {ascending:false}),
      sb.from('closing_draft').select('*').eq('bar_id', barId).maybeSingle(),
      sb.from('credit_users').select('*').eq('bar_id', barId).order('name'),
      sb.from('credit_transactions').select('*').eq('bar_id', barId).order('created_at', {ascending:false}),
      sb.from('transfer_batches').select('*, stock_transfers(*)').eq('bar_id', barId).order('created_at', {ascending:false})
    ]);
    const anyErr = pErr||cErr||dErr||cuErr||ctErr||tbErr;
    if(anyErr){ console.error(anyErr); toast('Could not reach the database — check your connection.'); }

    state.products = products || [];
    state.creditUsers = creditUsers || [];
    state.creditTransactions = creditTx || [];
    state.transferBatches = transferBatches || [];
    state.history = (closings||[]).map(c=>({
      id: c.id, date: c.closing_date, totalExpected: c.total_expected, cash: c.cash, upi: c.upi, card: c.card,
      credit: c.credit||0, totalCollected: c.total_collected, difference: c.difference, status: c.status, closedBy: c.closed_by,
      records: (c.closing_line_items||[]).map(li=>({
        id: li.id, productId: li.product_id, name: li.product_name, available: li.available, remaining: li.remaining,
        sold: li.sold, bulkSold: li.bulk_sold||0, sellingPrice: li.selling_price, expected: li.expected
      }))
    }));
    state.draft = (draftRow && draftRow.closing_date) ? {
      date: draftRow.closing_date, available: draftRow.available||{}, remaining: draftRow.remaining||{},
      cash: draftRow.cash||'', upi: draftRow.upi||'', card: draftRow.card||'', credits: draftRow.credits||[],
      bulkSold: draftRow.bulk_sold||{}
    } : null;
    state.loading = false;
    render();
  }
  // Kept as `loadAll` since every existing mutation handler already calls this
  // name to refresh state after a write — it now just reloads the current bar's data.
  async function loadAll(){ await loadBarData(); }

  async function saveDraft(){
    const d = state.draft;
    if(!d || !state.currentBar) return;
    await sb.from('closing_draft').upsert({
      bar_id: state.currentBar.bar_id,
      closing_date: d.date, available: d.available, remaining: d.remaining,
      cash: d.cash || 0, upi: d.upi || 0, card: d.card || 0, credits: d.credits || [], bulk_sold: d.bulkSold || {},
      updated_at: new Date().toISOString()
    }, {onConflict: 'bar_id'});
  }
  function scheduleDraftSave(){
    clearTimeout(draftSaveTimer);
    draftSaveTimer = setTimeout(saveDraft, 700);
  }
  async function clearDraft(){
    state.draft = null;
    if(!state.currentBar) return;
    await sb.from('closing_draft').delete().eq('bar_id', state.currentBar.bar_id);
  }

  function renderAuth(){
    const app = document.getElementById('app');
    app.innerHTML = `

        <div class="field"><label>Password</label><input type="password" id="au_password" autocomplete="${state.authScreen==='signup'?'new-password':'current-password'}"></div>

        <div id="au_barname_wrap" class="field" style="display:none;">
          <label>Bar name</label><input type="text" id="au_barname" placeholder="Royal Bar">
        </div>
        <div id="au_invite_note" style="display:none; color:var(--accent); font-size:12.5px; margin:-6px 0 12px;"></div>

        <div class="err" id="au_err"></div>

        <button class="btn secondary" id="au_switch" style="width:100%; margin-top:8px;">${state.authScreen==='signup' ? 'Already have an account? Sign in' : "New here? Register your bar"}</button>
      </div></div>`;

    const emailInput = document.getElementById('au_email');
    const barnameWrap = document.getElementById('au_barname_wrap');
    const inviteNote = document.getElementById('au_invite_note');

    if(state.authScreen==='signup'){
      // Check, on leaving the email field, whether this email has a pending
      // invite — if so this becomes a "join" instead of "create a new bar".
      emailInput.onblur = async ()=>{
        const email = emailInput.value.trim();
        if(!email){ return; }
        const {data} = await sb.rpc('check_pending_invite', {check_email: email});
        const invite = Array.isArray(data) ? data[0] : data;
        if(invite){
          barnameWrap.style.display = 'none';
          inviteNote.style.display = '';
          inviteNote.textContent = `You've been invited to join "${invite.bar_name}" as ${roleLabel(invite.role)}.`;
        } else {
          barnameWrap.style.display = '';
          inviteNote.style.display = 'none';
        }
      };
      barnameWrap.style.display = ''; // default assumption until blur check runs
    }

    document.getElementById('au_switch').onclick = ()=>{
      state.authScreen = state.authScreen==='signup' ? 'login' : 'signup';
      render();
    };

    document.getElementById('au_submit').onclick = async ()=>{
      const email = document.getElementById('au_email').value.trim();
      const password = document.getElementById('au_password').value;
      const errEl = document.getElementById('au_err');
      errEl.textContent = '';
      if(!email || !password){ errEl.textContent = 'Enter your email and password.'; return; }

      if(state.authScreen === 'login'){
        const {data, error} = await sb.auth.signInWithPassword({email, password});
        if(error){ errEl.textContent = error.message; return; }
        state.authUser = { id: data.user.id, email: data.user.email };
        state.loading = true; render();
        await afterAuthResolved();
        return;
      }

      // signup
      const {data: invite} = await sb.rpc('check_pending_invite', {check_email: email});
      const inv = Array.isArray(invite) ? invite[0] : invite;
      const barName = document.getElementById('au_barname').value.trim();
      if(!inv && !barName){ errEl.textContent = 'Enter a bar name.'; return; }

      const {data: signData, error: signErr} = await sb.auth.signUp({email, password});
      if(signErr){ errEl.textContent = signErr.message; return; }
      if(!signData.session){
        errEl.textContent = 'Account created — check your email to confirm, then sign in.';
        return;
      }
      state.authUser = { id: signData.user.id, email: signData.user.email };

      if(!inv){
        const {error: regErr} = await sb.rpc('register_new_bar', {new_bar_name: barName});
        if(regErr){
          errEl.textContent = (regErr.message||'').includes('DUPLICATE_BAR_NAME')
            ? 'A bar with this name already exists. Please choose a different name.'
            : regErr.message;
          return;
        }
      }
      state.loading = true; render();
      await afterAuthResolved();
    };
  }

    const sbEl = document.getElementById('sidebar');

    // Fixed 5-item mobile nav: Home | Inventory | Transfer | Closing | More
    const NAV_ICONS = {dashboard:'⌂', inventory:'▤', transfer:'⇄', closing:'✓'};
    const primaryIds = ['dashboard','inventory','transfer','closing'];
    const primary = primaryIds.filter(id=>tabs.some(t=>t.id===id)).map(id=>tabs.find(t=>t.id===id));
    const moreTabs = tabs.filter(t=>!primaryIds.includes(t.id));

    const bn = document.getElementById('bottomnav');
    bn.innerHTML='';
    const labelOverride = {dashboard:'Home', inventory:'Inventory', transfer:'Transfer', closing:'Closing'};
    primary.forEach(t=>{
      const b = document.createElement('button');
      b.className = (state.tab===t.id && !state.moreSheetOpen) ? 'active':'';
      b.innerHTML = `<span class="navicon">${NAV_ICONS[t.id]||''}</span><span>${labelOverride[t.id]||t.label}</span>`;
      b.onclick = ()=>{ state.moreSheetOpen=false; goToTab(t.id); };
      bn.appendChild(b);
    });
    if(moreTabs.length){
      const moreBtn = document.createElement('button');
      const moreActive = state.moreSheetOpen || moreTabs.some(t=>t.id===state.tab);
      moreBtn.className = moreActive ? 'active':'';
      moreBtn.innerHTML = `<span class="navicon">⋯</span><span>More</span>`;
      moreBtn.onclick = ()=>{
        pushNavLevel(()=>{ state.moreSheetOpen=false; document.getElementById('modalRoot').innerHTML=''; render(); });
        state.moreSheetOpen = true; render();
      };
      bn.appendChild(moreBtn);
    }

    if(state.moreSheetOpen){ renderMoreSheet(moreTabs); }
    else if(document.getElementById('moreOverlay')){ document.getElementById('modalRoot').innerHTML=''; }
  }

  function renderYesterdayClosing(bDate){
    const yDate = localISO(new Date(new Date(bDate+'T00:00:00').getTime() - 86400000));
    const rec = state.history.find(h=>h.date===yDate);
    if(!rec) return `<p style="color:var(--text-dim); font-size:12.5px; margin-bottom:4px;">${fmtDate(yDate)}</p><div class="empty">No closing recorded for that day.</div>`;
    const cls = rec.status==='MATCHED'?'good':(rec.status==='SHORTAGE'?'bad':'warn');
    return `<p style="color:var(--text-dim); font-size:12.5px; margin-bottom:10px;">${fmtDate(yDate)}</p>
      <div class="row">
        <div class="stat"><div class="label">Expected</div><div class="value">${fmt(rec.totalExpected)}</div></div>
        <div class="stat"><div class="label">Collected</div><div class="value">${fmt(rec.totalCollected)}</div></div>
        <div class="stat"><div class="label">Credit given</div><div class="value warn">${fmt(rec.credit)}</div></div>
        <div class="stat"><div class="label">Status</div><div class="value ${cls}" style="font-size:16px;">${rec.status}</div></div>
      </div>
      <button class="btn secondary" id="viewYesterdayInReports" style="margin-top:14px;">View in Reports</button>`;
  }
  function renderRecentHistoryTable(){
    const recent = [...state.history].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);
    if(!recent.length) return `<div class="empty">No days finalized yet.</div>`;
    return `<div class="tablewrap"><table class="mobile-cards"><thead><tr><th>Date</th><th class="num">Expected</th><th class="num">Collected</th><th class="num">Credit</th><th>Status</th></tr></thead>
      <tbody>${recent.map(r=>{
        const cls = r.status==='MATCHED'?'good':(r.status==='SHORTAGE'?'bad':'warn');
        return `<tr><td data-label="Date">${fmtDate(r.date)}</td><td class="num" data-label="Expected">${fmt(r.totalExpected)}</td><td class="num" data-label="Collected">${fmt(r.totalCollected)}</td><td class="num" data-label="Credit">${fmt(r.credit)}</td><td data-label="Status"><span class="badge ${cls}">${r.status}</span></td></tr>`;
      }).join('')}</tbody></table></div>`;
  }

  // Archives a product (soft delete) — preserves stock_additions/stock_transfers audit
  // history and all historical closing records, which already store their own
  // product name/price snapshot and don't depend on the live product row.
  async function archiveProduct(id){
    const {error} = await sb.from('products').update({active:false}).eq('id', id);
    if(error){ toast('Delete failed: '+error.message); return false; }
    return true;
  }
  async function deleteProduct(id){ // desktop path — unchanged native confirm() UX
    if(!confirm('Remove this product from your active list? Its sales and stock history are kept.')) return;
    const ok = await archiveProduct(id);
    if(!ok) return;
    closeModal();
    await loadAll();
  }
  function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

  function openAddStockModal(){
    document.getElementById('modalRoot').innerHTML = `
      <div class="overlay"><div class="modal">
        <h3>Add new stock</h3>
        <div class="field"><label>Product</label><select id="s_product">${state.products.map(p=>`<option value="${p.id}">${productLabel(p)}</option>`).join('')}</select></div>
        <div class="grid2">
          <div class="field"><label>Quantity</label><input type="number" inputmode="numeric" id="s_qty" min="1"></div>
          <div class="field"><label>Purchase price (₹, optional)</label><input type="number" inputmode="decimal" id="s_price"></div>

          <div class="field"><label>Date</label><input type="date" id="s_date" value="${calendarDateISO()}"></div>
          <div class="field"><label>Invoice / reference (optional)</label><input type="text" id="s_ref"></div>

      const product = productById(pid);
      const updatePayload = { main_stock: (product.main_stock||0) + qty };
      if(priceVal>0) updatePayload.purchase_price = priceVal;
      const {error:e1} = await sb.from('products').update(updatePayload).eq('id', pid);
      const {error:e2} = await sb.from('stock_additions').insert({
        product_id: pid, quantity: qty, purchase_price: priceVal, bar_id: state.currentBar.bar_id,
        added_date: document.getElementById('s_date').value || calendarDateISO(),
        supplier: document.getElementById('s_supplier').value.trim() || null,

    };

  // ---------- TRANSFER (Start Transfer wizard) ----------
  function renderTransfer(){
    const main = document.getElementById('main');
    const w = state.transferWizard;

    if(!w){
      main.innerHTML = renderTopbar() + `
        <div class="pagehead"><h1>Transfer stock</h1><p>Move bottles from main storage into daily inventory. You can run a transfer multiple times a day.</p></div>
        <div class="card">
          <button class="btn" id="startTransferBtn" ${state.products.length?'':'disabled'}>Start Transfer</button>
        </div>
        <div class="card"><h3>Today's transfers</h3>${renderTodaysTransfers()}</div>
      `;
      const btn = document.getElementById('startTransferBtn');
      if(btn) btn.onclick = ()=>{
        pushNavLevel(()=>{ state.transferWizard = null; render(); });
        state.transferWizard = {step:'entering', qtys:{}}; render();
      };
      return;
    }

    if(w.step === 'entering'){
      main.innerHTML = renderTopbar() + `
        <div class="pagehead"><h1>Transfer stock — enter quantities</h1><p>Enter how many of each product to move from main storage to daily inventory.</p></div>
        <div class="card">
          <div class="tablewrap"><table class="mobile-cards"><thead><tr>
            <th>Product</th><th class="num">Main storage</th><th class="num">Daily inventory</th><th style="width:140px;">Transfer</th>
          </tr></thead><tbody>
            ${state.products.map(p=>`
              <tr><td data-label="Product">${productLabel(p)}</td><td class="num" data-label="Main storage">${p.main_stock||0}</td><td class="num" data-label="Daily inventory">${p.daily_stock||0}</td>
                <td data-label="Transfer"><input type="number" inputmode="numeric" min="0" max="${p.main_stock||0}" placeholder="0" data-t-qty="${p.id}" value="${w.qtys[p.id]||''}"></td></tr>`).join('')}
          </tbody></table></div>
          <div class="actions" style="display:flex; justify-content:space-between; margin-top:16px;">
            <button class="btn secondary" id="cancelWizard">Cancel</button>
            <button class="btn" id="reviewTransfer">Review Transfer</button>
          </div>
        </div>
      `;
      main.querySelectorAll('[data-t-qty]').forEach(inp=>{
        inp.oninput = ()=>{ w.qtys[inp.dataset.tQty] = inp.value; };
      });
      document.getElementById('cancelWizard').onclick = goBackOneLevel;
      document.getElementById('reviewTransfer').onclick = ()=>{
        const entries = Object.entries(w.qtys).filter(([pid,q])=>parseInt(q,10)>0);
        if(!entries.length){ toast('Enter at least one quantity to transfer'); return; }
        for(const [pid,q] of entries){
          const p = productById(pid);
          if(parseInt(q,10) > (p.main_stock||0)){ toast(`${productLabel(p)}: cannot transfer more than available (${p.main_stock||0})`); return; }
        }
        pushNavLevel(()=>{ w.step='entering'; render(); });
        w.step = 'review';
        render();
      };
      return;
    }

    // review step
    const entries = Object.entries(w.qtys).filter(([pid,q])=>parseInt(q,10)>0).map(([pid,q])=>({p:productById(pid), qty:parseInt(q,10)}));
    main.innerHTML = renderTopbar() + `
      <div class="pagehead"><h1>Review transfer</h1><p>Confirm before moving stock.</p></div>
      <div class="card">
        <div class="tablewrap"><table class="mobile-cards"><thead><tr><th>Product</th><th class="num">Quantity</th></tr></thead>
          <tbody>${entries.map(e=>`<tr><td data-label="Product">${productLabel(e.p)}</td><td class="num" data-label="Quantity">${e.qty}</td></tr>`).join('')}</tbody>
        </table></div>
        <div class="actions" style="display:flex; justify-content:space-between; margin-top:16px;">
          <button class="btn secondary" id="backToEntry">Back</button>
          <button class="btn" id="confirmTransfer">Confirm Transfer</button>
        </div>
      </div>
    `;
    document.getElementById('backToEntry').onclick = goBackOneLevel;
    document.getElementById('confirmTransfer').onclick = async ()=>{
      const {data: batch, error: e0} = await sb.from('transfer_batches').insert({
        business_date: businessDateISO(), created_by: (state.authUser.email||''), bar_id: state.currentBar.bar_id
      }).select().single();
      if(e0){ toast('Transfer failed: '+e0.message); return; }
      for(const e of entries){
        await sb.from('products').update({ main_stock: (e.p.main_stock||0) - e.qty, daily_stock: (e.p.daily_stock||0) + e.qty }).eq('id', e.p.id);
        await sb.from('stock_transfers').insert({ product_id: e.p.id, quantity: e.qty, transfer_batch_id: batch.id, bar_id: state.currentBar.bar_id });
      }
      state.transferWizard = null;
      navBackStack = [];
      toast('Transfer complete');
      await loadAll();
    };
  }
  function renderTodaysTransfers(){
    const bDate = businessDateISO();
    const todays = state.transferBatches.filter(b=>b.business_date===bDate);
    if(!todays.length) return `<div class="empty">No transfers yet today.</div>`;
    return `<div class="tablewrap"><table class="mobile-cards"><thead><tr><th>Time</th><th>User</th><th>Items</th></tr></thead>
      <tbody>${todays.map(b=>{
        const items = (b.stock_transfers||[]).map(st=>{
          const p = productById(st.product_id);
          return `${p?productLabel(p):'—'} ×${st.quantity}`;
        }).join(', ');
        const t = new Date(b.created_at).toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
        return `<tr><td data-label="Time">${t}</td><td data-label="User">${b.created_by||'—'}</td><td data-label="Items">${items||'—'}</td></tr>`;
      }).join('')}</tbody></table></div>`;
  }

  // ---------- DAILY CLOSING ----------
  function computeClosingRows(d){
    d.bulkSold = d.bulkSold || {};
    d.credits = d.credits || [];
    const rows = state.products.filter(p=>p.id in d.available);
    let totalExpected = 0;
    const summaryRows = rows.map(p=>{
      const avail = d.available[p.id]||0;
      const rem = d.remaining[p.id];
      const hasRem = rem !== undefined && rem !== '';
      const sold = hasRem ? Math.max(0, avail - Number(rem)) : null;
      let bulkSold = 0, singleSold = sold, expected = 0;
      if(sold!==null){
        if(p.bulk_enabled){
          const bsRaw = d.bulkSold[p.id];
          bulkSold = (bsRaw!==undefined && bsRaw!=='') ? Math.min(Math.max(0,Number(bsRaw)), sold) : 0;
          singleSold = sold - bulkSold;
          expected = singleSold*(p.selling_price||0) + bulkSold*(p.bulk_price||0);
        } else {
          expected = sold*(p.selling_price||0);
        }
        totalExpected += expected;
      }
      return {p, avail, rem, sold, bulkSold, singleSold, expected};
    });
    const allEntered = summaryRows.every(r=>r.sold!==null);
    const cash = parseFloat(d.cash)||0, upi = parseFloat(d.upi)||0, card = parseFloat(d.card)||0;
    const totalCollected = cash+upi+card;
    const creditGivenTotal = d.credits.reduce((a,c)=>a+(parseFloat(c.amount)||0),0);
    const totalAccounted = totalCollected + creditGivenTotal;
    const diff = totalAccounted - totalExpected;
    let status = 'MATCHED', statusClass='good';
    if(diff < -0.5){ status='SHORTAGE'; statusClass='bad'; } else if(diff > 0.5){ status='EXCESS'; statusClass='warn'; }
    return {summaryRows, totalExpected, cash, upi, card, totalCollected, creditGivenTotal, diff, status, statusClass, allEntered};
  }

  function renderSalesSummary(calc, d){
    if(!calc.allEntered) return `<div class="empty">Enter remaining quantity for every product to see the sales summary.</div>`;
    const showBulk = anyBulkPricingConfigured();
    const head = showBulk
      ? `<tr><th>Product</th><th class="num">Sold</th><th class="num">Single ₹</th><th style="width:100px;">Bulk Sold</th><th class="num">Bulk ₹</th><th class="num">Expected</th></tr>`
      : `<tr><th>Product</th><th class="num">Sold</th><th class="num">Single ₹</th><th class="num">Expected</th></tr>`;
    const rows = calc.summaryRows.map(r=>{
      const bulkOnRow = hasBulkPricing(r.p);
      const commonStart = `<td data-label="Product">${productLabel(r.p)}</td><td class="num" data-label="Sold">${r.sold}</td><td class="num" data-label="Single ₹">${fmt(r.p.selling_price)}</td>`;
      const expectedCell = `<td class="num" data-label="Expected" id="expected-${r.p.id}">${fmt(r.expected)}</td>`;
      if(!showBulk) return `<tr>${commonStart}${expectedCell}</tr>`;
      const bulkSoldCell = bulkOnRow
        ? `<td data-label="Bulk Sold"><input type="number" inputmode="numeric" min="0" max="${r.sold}" data-bulk="${r.p.id}" value="${d.bulkSold[r.p.id]!==undefined?d.bulkSold[r.p.id]:''}"></td>`
        : `<td data-label="Bulk Sold">—</td>`;
      const bulkPriceCell = `<td class="num" data-label="Bulk ₹">${bulkOnRow ? fmt(r.p.bulk_price) : '—'}</td>`;
      return `<tr>${commonStart}${bulkSoldCell}${bulkPriceCell}${expectedCell}</tr>`;
    }).join('');
    return `<div class="tablewrap"><table class="mobile-cards"><thead>${head}</thead><tbody>${rows}</tbody></table></div>
      <div class="row" style="margin-top:12px;"><div class="stat"><div class="label">Total expected sales</div><div class="value" id="stat-total-expected-inline">${fmt(calc.totalExpected)}</div></div></div>`;
  }

  function renderCreditRows(d){

      <div class="creditrow" data-row="${i}">
        <select data-credit-select="${i}">
          <option value="__new__" ${!c.credit_user_id?'selected':''}>+ New person</option>
          ${state.creditUsers.map(u=>`<option value="${u.id}" ${c.credit_user_id===u.id?'selected':''}>${u.name}</option>`).join('')}

  function bindClosingHandlers(){
    const main = document.getElementById('main');
    const d = state.draft;

    main.querySelectorAll('[data-remaining]').forEach(inp=>{
      inp.oninput = ()=>{ d.remaining[inp.dataset.remaining] = inp.value; patchClosing(); };
    });
    bindBulkInputs();
    ['cash','upi','card'].forEach(key=>{
      const el = document.getElementById('in_'+key);
      if(el) el.oninput = ()=>{ d[key]=el.value; patchClosing(); };
    });
    document.getElementById('addCreditRow').onclick = ()=>{
      d.credits = d.credits || [];
      d.credits.push({credit_user_id:null, person:'', amount:''});
      document.getElementById('creditRows').innerHTML = renderCreditRows(d);
      bindCreditRowHandlers();
      scheduleDraftSave();
    };
    bindCreditRowHandlers();
    document.getElementById('cancelClosing').onclick = async ()=>{
      if(!confirm('Discard this closing in progress?')) return;
      await clearDraft(); render();
    };
    const finalizeBtn = document.getElementById('finalizeDay');
    if(finalizeBtn) finalizeBtn.onclick = finalizeClosing;
  }

  function bindBulkInputs(){
    const d = state.draft;
    document.querySelectorAll('[data-bulk]').forEach(inp=>{
      inp.oninput = ()=>{ d.bulkSold[inp.dataset.bulk] = inp.value; patchClosing(); };
    });

  function bindCreditRowHandlers(){
    const d = state.draft;
    document.querySelectorAll('[data-credit-select]').forEach(sel=>{
      sel.onchange = ()=>{
        const i = sel.dataset.creditSelect;
        const val = sel.value;
        d.credits[i].credit_user_id = val==='__new__' ? null : val;
        const nameInput = document.querySelector(`[data-credit-newname="${i}"]`);
        if(nameInput) nameInput.style.display = val==='__new__' ? '' : 'none';
        scheduleDraftSave();
      };
    });
    document.querySelectorAll('[data-credit-newname]').forEach(inp=>{
      inp.oninput = ()=>{ d.credits[inp.dataset.creditNewname].person = inp.value; scheduleDraftSave(); };
      inp.onblur = ()=>{
        const i = inp.dataset.creditNewname;
        if(d.credits[i].credit_user_id) return; // already resolved to an existing user
        const name = (d.credits[i].person||'').trim();
        if(!name) return;
        const match = findCreditUserByName(name);
        if(!match) return;
        showDuplicateUserConfirm(match,
          ()=>{
            d.credits[i].credit_user_id = match.id;
            d.credits[i].person = match.name;
            closeModal();
            document.getElementById('creditRows').innerHTML = renderCreditRows(d);
            bindCreditRowHandlers();
            patchClosing();
          },
          ()=>{ closeModal(); }
        );
      };
    });
    document.querySelectorAll('[data-credit-amount]').forEach(inp=>{
      inp.oninput = ()=>{ d.credits[inp.dataset.creditAmount].amount = inp.value; patchClosing(); };
    });
    document.querySelectorAll('[data-credit-remove]').forEach(btn=>{
      btn.onclick = ()=>{
        d.credits.splice(Number(btn.dataset.creditRemove),1);
        document.getElementById('creditRows').innerHTML = renderCreditRows(d);
        bindCreditRowHandlers();
        patchClosing();
      };
    });
  }

  // Patches computed values without rebuilding input elements (fixes focus loss while typing)
  function patchClosing(){
    const d = state.draft;
    const calc = computeClosingRows(d);
    calc.summaryRows.forEach(r=>{
      const soldEl = document.getElementById('sold-'+r.p.id);
      if(soldEl) soldEl.textContent = r.sold!==null ? r.sold : '—';
      const expEl = document.getElementById('expected-'+r.p.id);
      if(expEl) expEl.textContent = fmt(r.expected);
    });
    const expectedEl = document.getElementById('stat-expected');
    if(expectedEl) expectedEl.textContent = fmt(calc.totalExpected);
    const expectedInlineEl = document.getElementById('stat-total-expected-inline');
    if(expectedInlineEl) expectedInlineEl.textContent = fmt(calc.totalExpected);
    const collectedEl = document.getElementById('stat-collected');
    if(collectedEl) collectedEl.textContent = fmt(calc.totalCollected);
    const creditGivenEl = document.getElementById('stat-creditgiven');
    if(creditGivenEl) creditGivenEl.textContent = fmt(calc.creditGivenTotal);
    const diffEl = document.getElementById('stat-diff');
    if(diffEl){ diffEl.textContent = fmt(Math.abs(calc.diff)); diffEl.className = 'value ' + calc.statusClass; }
    const badge = document.getElementById('statusBadge');
    if(badge){ badge.className = 'badge ' + calc.statusClass; badge.textContent = calc.status + (calc.status!=='MATCHED' ? ': '+fmt(Math.abs(calc.diff)) : ''); }
    const finalizeBtn = document.getElementById('finalizeDay');
    if(finalizeBtn) finalizeBtn.disabled = !calc.allEntered;

    // if sales summary needs to switch between "empty" placeholder and full table, do a scoped rebuild
    const wrap = document.getElementById('salesSummaryWrap');
    const currentlyShowingTable = wrap && wrap.querySelector('table');
    if(wrap && (calc.allEntered !== !!currentlyShowingTable)){
      wrap.innerHTML = renderSalesSummary(calc, d);
      bindBulkInputs();
    }
    scheduleDraftSave();
  }

  async function finalizeClosing(){
    const d = state.draft;
    const calc = computeClosingRows(d);
    if(!calc.allEntered) return;
    const barId = state.currentBar.bar_id;
    const {data: closingRow, error: e1} = await sb.from('closings').insert({
      closing_date: d.date, total_expected: calc.totalExpected, cash: calc.cash, upi: calc.upi, card: calc.card,
      credit: calc.creditGivenTotal, total_collected: calc.totalCollected, difference: calc.diff, status: calc.status,
      closed_by: (state.authUser.email||''), bar_id: barId
    }).select().single();
    if(e1){ toast('Finalize failed: '+e1.message); return; }
    const lineItems = calc.summaryRows.map(r=>({
      closing_id: closingRow.id, product_id: r.p.id, product_name: productLabel(r.p), bar_id: barId,
      available: r.avail, remaining: Number(r.rem), sold: r.sold, bulk_sold: r.bulkSold||0,
      selling_price: r.p.selling_price, expected: r.expected
    }));
    const {error: e2} = await sb.from('closing_line_items').insert(lineItems);
    if(e2){ toast('Finalize failed: '+e2.message); return; }

    const validCredits = (d.credits||[]).filter(c=>parseFloat(c.amount)>0);
    for(const c of validCredits){
      let userId = c.credit_user_id;
      if(!userId){
        const name = (c.person||'').trim() || 'Unknown';
        const {data: newUser, error: eu} = await sb.from('credit_users').insert({name, bar_id: barId}).select().single();
        if(eu){ toast('Credit user failed: '+eu.message); continue; }
        userId = newUser.id;
      }
      await sb.from('credit_transactions').insert({
        credit_user_id: userId, type:'given', amount: parseFloat(c.amount), business_date: d.date, bar_id: barId,
        closing_id: closingRow.id, status:'active', recorded_by: (state.authUser.email||'')
      });
    }
    for(const r of calc.summaryRows){ await sb.from('products').update({ daily_stock: Number(r.rem) }).eq('id', r.p.id); }
    await clearDraft();
    toast('Day finalized');
    await loadAll();
  }

  // ---------- EDIT PAST CLOSING (owner only, until next day's closing starts) ----------
  function openEditClosingModal(rec){
    document.getElementById('modalRoot').innerHTML = `
      <div class="overlay"><div class="modal" style="max-width:600px;">
        <h3>Edit closing — ${fmtDate(rec.date)}</h3>
        <p style="color:var(--text-dim); font-size:12.5px; margin-bottom:14px;">
          You can correct the remaining counts and today's collection here. This updates the historical record and totals,
          but will NOT retroactively change current stock levels — check Daily Inventory afterwards if adjustments are needed.
        </p>
        <div class="tablewrap"><table class="mobile-cards"><thead><tr><th>Product</th><th class="num">Available</th><th style="width:100px;">Remaining</th><th style="width:100px;">Bulk sold</th></tr></thead>
        <tbody>${rec.records.map(r=>{
          const p = productById(r.productId);
          const bulkEnabled = p && p.bulk_enabled;
          return `<tr><td data-label="Product">${r.name}</td><td class="num" data-label="Available">${r.available}</td>
            <td data-label="Remaining"><input type="number" inputmode="numeric" min="0" max="${r.available}" data-edit-remaining="${r.productId}" value="${r.remaining}"></td>
            <td data-label="Bulk sold">${bulkEnabled ? `<input type="number" inputmode="numeric" min="0" data-edit-bulk="${r.productId}" value="${r.bulkSold||0}">` : '—'}</td></tr>`;
        }).join('')}</tbody></table></div>
        <div class="grid2" style="margin-top:14px;">
          <div class="field"><label>Cash (₹)</label><input type="number" inputmode="decimal" id="edit_cash" value="${rec.cash}"></div>
          <div class="field"><label>UPI (₹)</label><input type="number" inputmode="decimal" id="edit_upi" value="${rec.upi}"></div>
        </div>
        <div class="field"><label>Card (₹)</label><input type="number" inputmode="decimal" id="edit_card" value="${rec.card}"></div>
        <p style="color:var(--text-dim); font-size:12px;">Credit given (₹${fmt(rec.credit)}) isn't edited here — manage individual credit entries from the Credit tab.</p>
        <div class="actions"><button class="btn secondary" id="cancelEdit">Cancel</button><button class="btn" id="saveEdit">Recalculate &amp; save</button></div>
      </div></div>`;
    document.getElementById('cancelEdit').onclick = closeModal;
    document.getElementById('saveEdit').onclick = async ()=>{
      let totalExpected = 0;
      const updates = [];
      for(const r of rec.records){
        const p = productById(r.productId);
        const remInput = document.querySelector(`[data-edit-remaining="${r.productId}"]`);
        const bulkInput = document.querySelector(`[data-edit-bulk="${r.productId}"]`);
        const remaining = Math.max(0, parseInt(remInput.value,10)||0);
        const sold = Math.max(0, r.available - remaining);
        let bulkSold = 0, singleSold = sold, expected;
        if(p && p.bulk_enabled){
          bulkSold = bulkInput ? Math.min(Math.max(0, parseInt(bulkInput.value,10)||0), sold) : 0;
          singleSold = sold - bulkSold;
          expected = singleSold*(p?p.selling_price:r.sellingPrice||0) + bulkSold*(p?p.bulk_price:0);
        } else {
          expected = sold*(p?p.selling_price:r.sellingPrice);
        }
        totalExpected += expected;
        updates.push({id:r.id, remaining, sold, bulkSold, expected});
      }
      const cash = parseFloat(document.getElementById('edit_cash').value)||0;
      const upi = parseFloat(document.getElementById('edit_upi').value)||0;
      const card = parseFloat(document.getElementById('edit_card').value)||0;
      const totalCollected = cash+upi+card;
      const totalAccounted = totalCollected + (rec.credit||0);
      const diff = totalAccounted - totalExpected;
      let status = 'MATCHED';
      if(diff < -0.5) status='SHORTAGE'; else if(diff > 0.5) status='EXCESS';

      for(const u of updates){
        await sb.from('closing_line_items').update({remaining:u.remaining, sold:u.sold, bulk_sold:u.bulkSold, expected:u.expected}).eq('id', u.id);
      }
      await sb.from('closings').update({
        total_expected: totalExpected, cash, upi, card, total_collected: totalCollected, difference: diff, status
      }).eq('id', rec.id);

      closeModal(); toast('Closing updated');
      await loadAll();
    };
  }

  function openAddCreditModal(){

        <h3>Add credit</h3>
        <div class="field"><label>Person</label>
          <select id="ac_select">

      </div></div>`;

      const note = document.getElementById('ac_note').value.trim() || null;
      const selectVal = document.getElementById('ac_select').value;
      if(selectVal==='__new__'){
        const name = document.getElementById('ac_newname').value.trim();
        if(!name){ toast('Enter a name'); return; }
        const match = findCreditUserByName(name);
        if(match){
          pushNavLevel(()=>openAddCreditModal());
          showDuplicateUserConfirm(match,
            ()=>{ navBackStack=[]; insertCreditGiven(match.id, amount, note); },
            ()=>{ goBackOneLevel(); toast('Enter a different name to distinguish this person.'); }
          );
          return;
        }
        createNewCreditUserAndAdd(name, amount, note);
      } else {
        insertCreditGiven(selectVal, amount, note);

  async function insertCreditGiven(userId, amount, note){

      note, status:'active', recorded_by: (state.authUser.email||''), bar_id: state.currentBar.bar_id
    });
    if(error){ toast('Failed: '+error.message); return; }
    toast('Credit added');
    navBackStack = [];
    closeModal();
    await loadAll();
  }

    if(error){ toast('Failed: '+error.message); return; }
    await insertCreditGiven(data.id, amount, note);

  function renderProductSalesReport(){
    if(!state.history.length) return `<div class="empty">No sales history yet.</div>`;
    const agg = {};
    state.history.forEach(h=>h.records.forEach(r=>{
      if(!agg[r.productId]) agg[r.productId]={name:r.name, qty:0, bulkQty:0, sales:0};
      agg[r.productId].qty += r.sold; agg[r.productId].bulkQty += (r.bulkSold||0); agg[r.productId].sales += r.expected;
    }));
    const rows = Object.values(agg).sort((a,b)=>b.sales-a.sales);
    if(!rows.length) return `<div class="empty">No sales history yet.</div>`;
    return `<div class="tablewrap"><table class="mobile-cards"><thead><tr><th>Product</th><th class="num">Quantity sold</th><th class="num">Bulk qty</th><th class="num">Total sales</th></tr></thead>

  // ---------- EXPORTS ----------
  function exportDailyReportExcel(rec){
    const rows = rec.records.map(r=>({
      'Business Date': rec.date, 'Product': r.name, 'Available': r.available, 'Closing': r.remaining,
      'Sold': r.sold, 'Bulk Sold': r.bulkSold||0, 'Price': r.sellingPrice, 'Sales Amount': r.expected
    }));
    rows.push({});
    rows.push({'Product':'Expected Total', 'Sales Amount': rec.totalExpected});
    rows.push({'Product':'Cash', 'Sales Amount': rec.cash});
    rows.push({'Product':'UPI', 'Sales Amount': rec.upi});
    rows.push({'Product':'Card', 'Sales Amount': rec.card});
    rows.push({'Product':'Credit Given', 'Sales Amount': rec.credit});
    rows.push({'Product':'Settlement Status', 'Sales Amount': rec.status});
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Daily Report');
    XLSX.writeFile(wb, `Pegg-daily-report-${rec.date}.xlsx`);
  }
  function exportDailyReportPDF(rec){
    const doc = new window.jspdf.jsPDF();
    doc.setFontSize(14); doc.text(`Pegg — Daily Report — ${rec.date}`, 14, 16);
    doc.autoTable({
      startY: 22,
      head: [['Product','Available','Closing','Sold','Bulk Sold','Price','Sales']],
      body: rec.records.map(r=>[r.name, r.available, r.remaining, r.sold, r.bulkSold||0, fmt(r.sellingPrice), fmt(r.expected)])
    });
    const y = doc.lastAutoTable.finalY + 8;
    doc.autoTable({
      startY: y,
      head: [['Summary','Value']],
      body: [
        ['Expected Total', fmt(rec.totalExpected)], ['Cash', fmt(rec.cash)], ['UPI', fmt(rec.upi)],
        ['Card', fmt(rec.card)], ['Credit Given', fmt(rec.credit)], ['Status', rec.status]
      ]
    });
    doc.save(`Pegg-daily-report-${rec.date}.pdf`);
  }
  function exportCollectionExcel(){
    const rows = [...state.history].sort((a,b)=>a.date.localeCompare(b.date)).map(h=>{
      const cc = creditCollectedForDate(h.date);
      return {'Date':h.date,'Expected':h.totalExpected,'Cash':h.cash,'UPI':h.upi,'Card':h.card,'Credit Given':h.credit,'Credit Collected':cc.total,'Status':h.status};
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Collection Report');
    XLSX.writeFile(wb, `Pegg-collection-report.xlsx`);
  }
  function exportCollectionPDF(){
    const doc = new window.jspdf.jsPDF();
    doc.setFontSize(14); doc.text('Pegg — Collection Report', 14, 16);
    doc.autoTable({
      startY: 22,
      head: [['Date','Expected','Cash','UPI','Card','Credit Given','Credit Collected','Status']],
      body: [...state.history].sort((a,b)=>a.date.localeCompare(b.date)).map(h=>{
        const cc = creditCollectedForDate(h.date);
        return [h.date, fmt(h.totalExpected), fmt(h.cash), fmt(h.upi), fmt(h.card), fmt(h.credit), fmt(cc.total), h.status];
      })
    });
    doc.save('Pegg-collection-report.pdf');
  }

  // ---------- USERS ----------
  function renderUsers(){
    const main = document.getElementById('main');
    main.innerHTML = renderTopbar() + `
      <div class="pagehead"><h1>Users</h1><p>Owner has full access. Manager access is limited to daily operations.</p></div>
      <div class="card">
        <div class="row" style="justify-content:space-between; align-items:center;"><h3 style="margin:0;">Team members</h3><button class="btn" id="inviteUserBtn">Invite by email</button></div>
        <div class="tablewrap" style="margin-top:14px;" id="membersWrap"><div class="empty">Loading…</div></div>
      </div>
      <div class="card"><h3>Pending invites</h3><div id="invitesWrap"><div class="empty">Loading…</div></div></div>
    `;
    document.getElementById('inviteUserBtn').onclick = openInviteModal;
    loadAndRenderMembers();
    loadAndRenderInvites();
  }
  async function loadAndRenderMembers(){
    const {data, error} = await sb.rpc('list_bar_members', {target_bar_id: state.currentBar.bar_id});
    const wrap = document.getElementById('membersWrap');
    if(!wrap) return;
    if(error){ wrap.innerHTML = `<div class="empty">Could not load members: ${error.message}</div>`; return; }
    wrap.innerHTML = `<table class="mobile-cards"><thead><tr><th>Email</th><th>Role</th><th></th></tr></thead>
      <tbody>${data.map(m=>`
        <tr><td data-label="Email">${m.email}</td><td data-label="Role">${roleLabel(m.role)}</td>
          <td data-label="" style="text-align:right;">
            ${m.user_id!==state.authUser.id ? `<button class="iconbtn danger" data-removemember="${m.user_id}">Remove</button>` : `<span style="color:var(--text-dim); font-size:12px;">You</span>`}
          </td></tr>`).join('')}
      </tbody></table>`;
    wrap.querySelectorAll('[data-removemember]').forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm('Remove this person from your bar?')) return;
        const {error} = await sb.rpc('remove_bar_member', {target_bar_id: state.currentBar.bar_id, target_user_id: b.dataset.removemember});
        if(error){ toast('Failed: '+error.message); return; }
        toast('Member removed');
        loadAndRenderMembers();
      };
    });
  }
  async function loadAndRenderInvites(){
    const {data, error} = await sb.rpc('list_pending_invites', {target_bar_id: state.currentBar.bar_id});
    const wrap = document.getElementById('invitesWrap');
    if(!wrap) return;
    if(error){ wrap.innerHTML = `<div class="empty">Could not load invites: ${error.message}</div>`; return; }
    if(!data.length){ wrap.innerHTML = `<div class="empty">No pending invites.</div>`; return; }
    wrap.innerHTML = `<table class="mobile-cards"><thead><tr><th>Email</th><th>Role</th><th>Sent</th><th></th></tr></thead>
      <tbody>${data.map(i=>`
        <tr><td data-label="Email">${i.email}</td><td data-label="Role">${roleLabel(i.role)}</td><td data-label="Sent">${fmtDate(i.created_at.slice(0,10))}</td>
          <td data-label=""><button class="iconbtn danger" data-revokeinvite="${i.id}">Revoke</button></td></tr>`).join('')}
      </tbody></table>`;
    wrap.querySelectorAll('[data-revokeinvite]').forEach(b=>{
      b.onclick = async ()=>{
        const {error} = await sb.rpc('revoke_invite', {invite_id: b.dataset.revokeinvite});
        if(error){ toast('Failed: '+error.message); return; }
        toast('Invite revoked');
        loadAndRenderInvites();
      };
    });
  }
  function openInviteModal(){
    document.getElementById('modalRoot').innerHTML = `
      <div class="overlay"><div class="modal">
        <h3>Invite a team member</h3>
        <p style="color:var(--text-dim); font-size:12.5px; margin-bottom:14px;">They'll be able to join as soon as they sign up with this email — no need to give them a password yourself.</p>
        <div class="field"><label>Email</label><input type="text" id="inv_email" placeholder="rahul@example.com"></div>
        <div class="field"><label>Role</label><select id="inv_role">
          <option value="manager">Manager</option>
          <option value="owner">Owner</option>
        </select></div>
        <div class="err" id="inv_err"></div>
        <div class="actions"><button class="btn secondary" id="inv_cancel">Cancel</button><button class="btn" id="inv_send">Send invite</button></div>
      </div></div>`;
    document.getElementById('inv_cancel').onclick = closeModal;
    document.getElementById('inv_send').onclick = async ()=>{
      const email = document.getElementById('inv_email').value.trim();
      const role = document.getElementById('inv_role').value;
      const errEl = document.getElementById('inv_err');
      if(!email){ errEl.textContent = 'Enter an email address.'; return; }
      const {error} = await sb.rpc('invite_bar_member', {target_bar_id: state.currentBar.bar_id, target_email: email, target_role: role});
      if(error){ errEl.textContent = error.message; return; }
      toast('Invite sent');
      closeModal();
      loadAndRenderInvites();
    };
  }

  // ---------- RENDER DISPATCH ----------
  // ---------- SUPER ADMIN ----------
  async function renderSuperAdminPanel(){
    const app = document.getElementById('app');
    app.innerHTML = `<main style="max-width:900px; margin:0 auto; padding:0 24px 60px;">
      <div class="topbar"><button class="btn secondary" id="admin_back">‹ Back to Pegg</button></div>
      <div class="pagehead"><h1>Platform Admin</h1><p>All registered bars on Pegg.</p></div>
      <div class="card" id="admin_barlist"><div class="empty">Loading…</div></div>
    </main>`;
    document.getElementById('admin_back').onclick = ()=>{ state.showSuperAdminPanel = false; render(); };

    const {data: bars, error} = await sb.rpc('admin_list_bars');
    const wrap = document.getElementById('admin_barlist');
    if(error){ wrap.innerHTML = `<div class="empty">Could not load bars: ${error.message}</div>`; return; }
    wrap.innerHTML = `<div class="tablewrap"><table class="mobile-cards"><thead><tr><th>Bar</th><th class="num">Members</th><th>Status</th><th>Created</th><th></th></tr></thead>
      <tbody>${bars.map(b=>`
        <tr>
          <td data-label="Bar">${b.name}</td>
          <td class="num" data-label="Members">${b.member_count}</td>
          <td data-label="Status"><span class="badge ${b.active?'good':'neutral'}">${b.active?'Active':'Deactivated'}</span></td>
          <td data-label="Created">${fmtDate(b.created_at.slice(0,10))}</td>
          <td data-label="">
            <button class="iconbtn" data-toggle="${b.id}" data-active="${b.active}">${b.active?'Deactivate':'Reactivate'}</button>
            <button class="iconbtn danger" data-admindelete="${b.id}" data-name="${b.name}">Delete</button>
          </td>
        </tr>`).join('')}</tbody></table></div>`;
    wrap.querySelectorAll('[data-toggle]').forEach(btn=>{
      btn.onclick = async ()=>{
        const active = btn.dataset.active === 'true';
        const {error} = await sb.rpc('admin_set_bar_active', {target_bar_id: btn.dataset.toggle, is_active: !active});
        if(error){ toast('Failed: '+error.message); return; }
        toast(active ? 'Bar deactivated' : 'Bar reactivated');
        renderSuperAdminPanel();
      };
    });
    wrap.querySelectorAll('[data-admindelete]').forEach(btn=>{
      btn.onclick = ()=>openAdminDeleteConfirm(btn.dataset.admindelete, btn.dataset.name);
    });
  }
  function openAdminDeleteConfirm(barId, barName){
    document.getElementById('modalRoot').innerHTML = `
      <div class="overlay"><div class="modal">
        <h3>Delete ${barName} permanently?</h3>
        <p>All associated data will be permanently deleted. This cannot be undone.</p>
        <div class="field"><label>Type "${barName}" to confirm</label><input type="text" id="admin_confirm_name"></div>
        <div class="actions"><button class="btn secondary" id="admin_del_cancel">Cancel</button><button class="btn danger" id="admin_del_confirm">Delete Permanently</button></div>
      </div></div>`;
    document.getElementById('admin_del_cancel').onclick = closeModal;
    document.getElementById('admin_del_confirm').onclick = async ()=>{
      const typed = document.getElementById('admin_confirm_name').value;
      const {error} = await sb.rpc('admin_delete_bar', {target_bar_id: barId, confirm_name: typed});
      if(error){ toast('Failed: '+(error.message.includes('NAME_MISMATCH')?'Name did not match.':error.message)); return; }
      toast('Bar permanently deleted');
      closeModal();
      renderSuperAdminPanel();
    };
  }

  function render(){
    if(NOT_CONFIGURED){ renderNotConfigured(); return; }
    if(state.loading){ document.getElementById('app').innerHTML = `<div class="authwrap"><div style="color:var(--text-dim);">Loading…</div></div>`; return; }
    if(!state.authUser){ renderAuth(); return; }
    if(state.showSuperAdminPanel){ renderSuperAdminPanel(); return; }
    if(!state.currentBar){ renderBarSelect(); return; }
    renderShell(); renderNav();
    const allowed = visibleTabs().map(t=>t.id);
    if(!allowed.includes(state.tab)) state.tab = allowed[0];
    switch(state.tab){
      case 'dashboard': renderDashboard(); break;
      case 'products': renderProducts(); break;
      case 'inventory': renderInventory(); break;
      case 'transfer': renderTransfer(); break;
      case 'closing': renderClosing(); break;
      case 'credit': renderCredit(); break;
      case 'reports': renderReports(); break;
      case 'users': renderUsers(); break;
    }
  }

  if(NOT_CONFIGURED){ render(); } else { initApp(); }

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
