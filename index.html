<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Pegg — Bar Stock &amp; Settlement</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#18140F">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#18140F; --panel:#231D16; --panel-2:#2B241B; --line:#3B3125;
    --text:#EFE7D8; --text-dim:#A99C87; --accent:#C98A3E; --accent-soft:#3A2B18;
    --good:#5FA779; --good-soft:#20301F; --bad:#C4695A; --bad-soft:#341F1B;
    --warn:#D9AE4E; --warn-soft:#332B18; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overflow-x:hidden; width:100%;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; margin:0; letter-spacing:0.2px; }
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums;}
  #app{display:flex; min-height:100vh; width:100%; max-width:100vw;}

  #sidebar{ width:220px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); padding:22px 14px; display:flex; flex-direction:column; gap:4px; }
  #sidebar .brand{ font-family:'Fraunces',serif; font-size:20px; font-weight:700; color:var(--accent); margin-bottom:18px; padding:0 8px; }
  #sidebar .brand span{display:block; font-family:'Inter'; font-size:11px; color:var(--text-dim); font-weight:400; margin-top:2px;}
  .navbtn{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer; color:var(--text-dim); font-size:14px; font-weight:500; border:none; background:transparent; text-align:left; width:100%; }
  .navbtn:hover{background:var(--panel-2); color:var(--text);}
  .navbtn.active{background:var(--accent-soft); color:var(--accent);}
  .navbtn .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6;flex-shrink:0;}
  .sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--line);}
  .who{font-size:12px; color:var(--text-dim); padding:0 8px 8px;}
  .who b{color:var(--text); font-weight:600;}
  .who .role{color:var(--accent); font-size:11px;}

  main{flex:1; min-width:0; padding:0 32px 100px; max-width:1000px; width:100%;}
  .topbar{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:16px 0 0; flex-wrap:wrap; }
  .topbar .who-inline{font-size:12.5px; color:var(--text-dim);}
  .topbar .who-inline b{color:var(--text);}
  .biz-date-pill{font-size:11.5px; background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim); padding:4px 10px; border-radius:20px;}
  .pagehead{margin:18px 0 22px;}
  .pagehead h1{font-size:26px;}
  .pagehead p{color:var(--text-dim); margin-top:4px; font-size:14px;}
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; max-width:100%; overflow:hidden; }
  .card h3{font-size:15px; margin-bottom:12px; color:var(--text);}
  .row{display:flex; gap:14px; flex-wrap:wrap;}
  .stat{flex:1; min-width:140px;}
  .stat .label{font-size:12px; color:var(--text-dim);}
  .stat .value{font-family:'Fraunces',serif; font-size:24px; margin-top:4px; word-break:break-word;}
  .stat .value.good{color:var(--good);} .stat .value.bad{color:var(--bad);} .stat .value.warn{color:var(--warn);}

  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{ text-align:left; padding:8px 10px; font-size:11.5px; color:var(--text-dim); border-bottom:1px solid var(--line); font-weight:600; }
  td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right; font-family:'IBM Plex Mono',monospace;}
  .tablewrap{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;}

  input[type=text], input[type=number], input[type=date], input[type=password], select{
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:11px 10px; border-radius:7px; font-size:15px; width:100%;
    font-family:'Inter',sans-serif; min-height:44px;
  }
  input[type=number]{font-family:'IBM Plex Mono',monospace;}
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  input[type=password]{font-family:'IBM Plex Mono',monospace; letter-spacing:2px;}
  input:focus, select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  label{font-size:12px; color:var(--text-dim); display:block; margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end;}

  button.btn{ background:var(--accent); color:#20160A; border:none; padding:12px 18px; border-radius:8px; font-weight:600; font-size:14.5px; cursor:pointer; min-height:44px; }
  button.btn:hover{filter:brightness(1.08);}
  button.btn.secondary{background:var(--panel-2); color:var(--text); border:1px solid var(--line);}
  button.btn.danger{background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad);}
  button.btn:disabled{opacity:.4; cursor:not-allowed;}
  button.iconbtn{ background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:13.5px; padding:8px 10px; min-height:38px; }
  button.iconbtn:hover{color:var(--accent);}
  button.iconbtn.danger{color:var(--bad);}

  .badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:12px; font-weight:600;}
  .badge.good{background:var(--good-soft); color:var(--good);}
  .badge.bad{background:var(--bad-soft); color:var(--bad);}
  .badge.warn{background:var(--warn-soft); color:var(--warn);}
  .badge.neutral{background:var(--panel-2); color:var(--text-dim);}
  .empty{color:var(--text-dim); font-size:14px; padding:20px 4px; text-align:center;}

  .overlay{ position:fixed; inset:0; background:rgba(10,8,5,.6); display:flex; align-items:center; justify-content:center; z-index:50; padding:12px; }
  .modal{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; width:100%; max-width:460px; max-height:88vh; overflow:auto; }
  .modal h3{margin-bottom:16px;}
  .modal .actions{display:flex; justify-content:flex-end; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .modal .actions button{flex:1; min-width:120px;}

  .toast{ position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:8px; font-size:13px; z-index:100; box-shadow:0 6px 18px rgba(0,0,0,.35); max-width:90vw; text-align:center; }

  .authwrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .authcard{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:32px 28px; width:100%; max-width:380px; }
  .authcard .brand{ font-family:'Fraunces',serif; font-size:24px; font-weight:700; color:var(--accent); margin-bottom:4px; }
  .authcard .sub{color:var(--text-dim); font-size:13px; margin-bottom:22px;}
  .authcard .err{color:var(--bad); font-size:13px; margin-top:4px; min-height:16px;}
  .userlist{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .userpick{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border:1px solid var(--line); border-radius:8px; cursor:pointer; background:var(--bg); min-height:44px; }
  .userpick:hover{border-color:var(--accent);}
  .userpick .name{font-size:14px;}
  .userpick .role{font-size:11px; color:var(--text-dim);}

  .creditrow{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; align-items:center;}
  .creditrow > *{flex:1; min-width:110px;}
  .creditrow button{flex:0 0 auto; min-width:38px;}

  /* Mobile card tables */
  @media (max-width: 820px){
    table.mobile-cards thead{display:none;}
    table.mobile-cards, table.mobile-cards tbody{display:block; width:100%;}
    table.mobile-cards tr{
      display:block; border:1px solid var(--line); border-radius:10px;
      padding:6px 12px; margin-bottom:10px; background:var(--panel-2);
    }
    table.mobile-cards td{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      border:none; padding:8px 0; text-align:right;
    }
    table.mobile-cards td::before{
      content:attr(data-label); color:var(--text-dim); font-size:11.5px; font-weight:600;
      text-align:left; margin-right:auto;
    }
    table.mobile-cards td > input, table.mobile-cards td > select{ max-width:150px; }
  }

  #bottomnav{display:none;}
  @media (max-width: 820px){
    #sidebar{display:none;}
    main{padding:0 12px 100px;}
    .topbar{padding-top:10px;}
    #bottomnav{
      display:flex; position:fixed; bottom:0; left:0; right:0; height:64px;
      background:var(--panel); border-top:1px solid var(--line);
      overflow-x:auto; -webkit-overflow-scrolling:touch; scroll-behavior:smooth;
      z-index:40; scrollbar-width:none;
    }
    #bottomnav::-webkit-scrollbar{display:none;}
    #bottomnav button{
      flex:0 0 auto; width:78px; background:none; border:none; color:var(--text-dim);
      font-size:10.5px; padding:10px 4px 8px; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:4px; cursor:pointer; min-height:56px;
    }
    #bottomnav button .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7;}
    #bottomnav button.active{color:var(--accent);}
    .row{flex-direction:column;} .grid2{grid-template-columns:1fr;} .grid3{grid-template-columns:1fr;}
    .card{padding:16px 14px;}
    .modal{padding:16px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
  "use strict";

  // ====== Supabase project ======
  const SUPABASE_URL = "https://atuplufrgsbkuhzisdng.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0dXBsdWZyZ3Nia3VoemlzZG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzM2OTcsImV4cCI6MjEwNDU0OTY5N30.7hr-dzj9yULzFuG9egWQJns3t184s9e7HDzZDY7HB90";
  // ================================

  const NOT_CONFIGURED = SUPABASE_URL.includes('YOUR_') || SUPABASE_ANON_KEY.includes('YOUR_');
  const sb = NOT_CONFIGURED ? null : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const BUSINESS_DAY_CUTOFF_HOUR = 6; // business day runs until this hour the next morning
  const SESSION_KEY = 'pegg.session.userId';

  const ALL_TABS = [
    {id:'dashboard', label:'Dashboard', roles:['owner','manager']},
    {id:'products', label:'Products', roles:['owner']},
    {id:'mainstorage', label:'Main Storage', roles:['owner']},
    {id:'transfer', label:'Transfer', roles:['owner','manager']},
    {id:'dailyinv', label:'Daily Inv.', roles:['owner','manager']},
    {id:'closing', label:'Closing', roles:['owner','manager']},
    {id:'credit', label:'Credit', roles:['owner','manager']},
    {id:'reports', label:'Reports', roles:['owner']},
    {id:'users', label:'Users', roles:['owner']},
  ];

  let state = {
    products: [], users: [], history: [], draft: null,
    creditUsers: [], creditTransactions: [],
    transferBatches: [],
    session: null, loginPickedId: null, tab: 'dashboard', loading: true,
    transferWizard: null // {step:'entering'|'review', qtys:{}}
  };
  let draftSaveTimer = null;

  // ---------- helpers ----------
  function fmt(n){ n = Number(n)||0; return '₹' + n.toLocaleString('en-IN', {maximumFractionDigits:2}); }
  function localISO(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
  function calendarDateISO(){ return localISO(new Date()); }
  function businessDateISO(date){
    const d = date ? new Date(date) : new Date();
    if(d.getHours() < BUSINESS_DAY_CUTOFF_HOUR){ d.setDate(d.getDate()-1); }
    return localISO(d);
  }
  function fmtDate(iso){
    if(!iso) return '—';
    const d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
  }
  function toast(msg){
    const root = document.getElementById('toastRoot');
    const el = document.createElement('div');
    el.className='toast'; el.textContent=msg;
    root.appendChild(el);
    setTimeout(()=>el.remove(), 2600);
  }
  function productById(id){ return state.products.find(p=>p.id===id); }
  function productLabel(p){ return p ? p.name + (p.size ? ' ' + p.size : '') : 'Unknown product'; }
  function visibleTabs(){ return state.session ? ALL_TABS.filter(t=>t.roles.includes(state.session.role)) : []; }
  function roleLabel(role){ return role==='owner' ? 'Owner' : 'Manager'; }
  function creditUserById(id){ return state.creditUsers.find(u=>u.id===id); }
  function creditBalance(userId){
    let bal = 0;
    state.creditTransactions.filter(t=>t.credit_user_id===userId && t.status==='active').forEach(t=>{
      bal += t.type==='given' ? Number(t.amount) : -Number(t.amount);
    });
    return bal;
  }
  function totalOutstandingCredit(){
    return state.creditUsers.reduce((a,u)=>a+Math.max(0,creditBalance(u.id)),0);
  }
  function creditCollectedForDate(dateStr){
    const txs = state.creditTransactions.filter(t=>t.type==='repayment' && t.status==='active' && t.business_date===dateStr);
    const cash = txs.filter(t=>t.method==='cash').reduce((a,t)=>a+Number(t.amount),0);
    const upi = txs.filter(t=>t.method==='upi').reduce((a,t)=>a+Number(t.amount),0);
    return {cash, upi, total: cash+upi};
  }
  function closingEditableDate(dateStr){
    const laterClosingExists = state.history.some(h=>h.date > dateStr);
    const laterDraftExists = state.draft && state.draft.date > dateStr;
    return !laterClosingExists && !laterDraftExists;
  }

  // ---------- DATA LAYER ----------
  async function loadAll(){
    const [
      {data: products, error: pErr}, {data: users, error: uErr},
      {data: closings, error: cErr}, {data: draftRow, error: dErr},
      {data: creditUsers, error: cuErr}, {data: creditTx, error: ctErr},
      {data: transferBatches, error: tbErr}
    ] = await Promise.all([
      sb.from('products').select('*').order('name'),
      sb.from('app_users').select('*'),
      sb.from('closings').select('*, closing_line_items(*)').order('closing_date', {ascending:false}),
      sb.from('closing_draft').select('*').eq('id', true).maybeSingle(),
      sb.from('credit_users').select('*').order('name'),
      sb.from('credit_transactions').select('*').order('created_at', {ascending:false}),
      sb.from('transfer_batches').select('*, stock_transfers(*)').order('created_at', {ascending:false})
    ]);
    const anyErr = pErr||uErr||cErr||dErr||cuErr||ctErr||tbErr;
    if(anyErr){ console.error(anyErr); toast('Could not reach the database — check your connection.'); }

    state.products = products || [];
    state.users = users || [];
    state.creditUsers = creditUsers || [];
    state.creditTransactions = creditTx || [];
    state.transferBatches = transferBatches || [];
    state.history = (closings||[]).map(c=>({
      id: c.id, date: c.closing_date, totalExpected: c.total_expected, cash: c.cash, upi: c.upi, card: c.card,
      credit: c.credit||0, totalCollected: c.total_collected, difference: c.difference, status: c.status, closedBy: c.closed_by,
      records: (c.closing_line_items||[]).map(li=>({
        id: li.id, productId: li.product_id, name: li.product_name, available: li.available, remaining: li.remaining,
        sold: li.sold, bulkSold: li.bulk_sold||0, sellingPrice: li.selling_price, expected: li.expected
      }))
    }));
    state.draft = (draftRow && draftRow.closing_date) ? {
      date: draftRow.closing_date, available: draftRow.available||{}, remaining: draftRow.remaining||{},
      cash: draftRow.cash||'', upi: draftRow.upi||'', card: draftRow.card||'', credits: draftRow.credits||[],
      bulkSold: draftRow.bulk_sold||{}
    } : null;
    state.loading = false;

    // restore session from localStorage
    if(!state.session){
      try{
        const savedId = localStorage.getItem(SESSION_KEY);
        if(savedId){
          const u = state.users.find(x=>x.id===savedId);
          if(u) state.session = u; else localStorage.removeItem(SESSION_KEY);
        }
      }catch(e){}
    }
    render();
  }

  async function saveDraft(){
    const d = state.draft;
    if(!d) return;
    await sb.from('closing_draft').update({
      closing_date: d.date, available: d.available, remaining: d.remaining,
      cash: d.cash || 0, upi: d.upi || 0, card: d.card || 0, credits: d.credits || [], bulk_sold: d.bulkSold || {},
      updated_at: new Date().toISOString()
    }).eq('id', true);
  }
  function scheduleDraftSave(){
    clearTimeout(draftSaveTimer);
    draftSaveTimer = setTimeout(saveDraft, 700);
  }
  async function clearDraft(){
    state.draft = null;
    await sb.from('closing_draft').update({
      closing_date: null, available: {}, remaining: {}, cash: 0, upi: 0, card: 0, credits: [], bulk_sold: {}, updated_at: new Date().toISOString()
    }).eq('id', true);
  }

  // ---------- NOT CONFIGURED ----------
  function renderNotConfigured(){
    document.getElementById('app').innerHTML = `
      <div class="authwrap"><div class="authcard" style="max-width:460px;">
        <div class="brand">Pegg</div>
        <div class="sub">This app needs to be pointed at your Supabase project before it can store anything.</div>
      </div></div>`;
  }

  // ---------- AUTH ----------
  function renderSetup(){
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="authwrap"><div class="authcard">
        <div class="brand">Pegg</div>
        <div class="sub">First time setup — create the owner account.</div>
        <div class="field"><label>Your name</label><input type="text" id="su_name" placeholder="e.g. Aniket"></div>
        <div class="field"><label>Username</label><input type="text" id="su_username" placeholder="owner"></div>
        <div class="field"><label>PIN (4+ digits)</label><input type="password" id="su_pin" inputmode="numeric"></div>
        <div class="err" id="su_err"></div>
        <button class="btn" id="su_create" style="width:100%; margin-top:6px;">Create owner account</button>
      </div></div>`;
    document.getElementById('su_create').onclick = async ()=>{
      const name = document.getElementById('su_name').value.trim();
      const username = document.getElementById('su_username').value.trim().toLowerCase();
      const pin = document.getElementById('su_pin').value.trim();
      const errEl = document.getElementById('su_err');
      if(!name || !username || pin.length<4){ errEl.textContent = 'Enter your name, a username, and a PIN of at least 4 digits.'; return; }
      const {data, error} = await sb.from('app_users').insert({name, username, pin, role:'owner'}).select().single();
      if(error){ errEl.textContent = error.message; return; }
      state.users = [data];
      loginAs(data);
    };
  }
  function loginAs(user){
    state.session = user;
    state.loginPickedId = null;
    state.tab = 'dashboard';
    try{ localStorage.setItem(SESSION_KEY, user.id); }catch(e){}
    render();
  }
  function renderLogin(){
    const app = document.getElementById('app');
    const picked = state.loginPickedId ? state.users.find(u=>u.id===state.loginPickedId) : null;
    app.innerHTML = `
      <div class="authwrap"><div class="authcard">
        <div class="brand">Pegg</div>
        <div class="sub">${picked ? 'Enter PIN for '+picked.name : 'Choose your account to sign in.'}</div>
        ${!picked ? `
          <div class="userlist">
            ${state.users.map(u=>`
              <div class="userpick" data-pick="${u.id}">
                <div><div class="name">${u.name}</div><div class="role">${roleLabel(u.role)}</div></div>
                <span style="color:var(--text-dim);">›</span>
              </div>`).join('')}
          </div>
        ` : `
          <div class="field"><label>PIN</label><input type="password" id="li_pin" inputmode="numeric" autofocus></div>
          <div class="err" id="li_err"></div>
          <button class="btn" id="li_submit" style="width:100%; margin-top:6px;">Sign in</button>
          <button class="btn secondary" id="li_back" style="width:100%; margin-top:8px;">Back</button>
        `}
      </div></div>`;
    if(!picked){
      app.querySelectorAll('[data-pick]').forEach(el=>{ el.onclick = ()=>{ state.loginPickedId = el.dataset.pick; render(); }; });
    } else {
      document.getElementById('li_back').onclick = ()=>{ state.loginPickedId=null; render(); };
      const pinInput = document.getElementById('li_pin');
      const doLogin = ()=>{
        if(pinInput.value.trim() === picked.pin){ loginAs(picked); }
        else { document.getElementById('li_err').textContent = 'Incorrect PIN.'; }
      };
      document.getElementById('li_submit').onclick = doLogin;
      pinInput.onkeydown = (e)=>{ if(e.key==='Enter') doLogin(); };
    }
  }
  function logout(){
    state.session = null; state.loginPickedId = null; state.tab = 'dashboard';
    try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
    render();
  }

  // ---------- DAILY CLOSING ----------
  function computeClosingRows(d){
    d.bulkSold = d.bulkSold || {};
    d.credits = d.credits || [];
    const rows = state.products.filter(p=>p.id in d.available);
    let totalExpected = 0;
    const summaryRows = rows.map(p=>{
      const avail = d.available[p.id]||0;
      const rem = d.remaining[p.id];
      const hasRem = rem !== undefined && rem !== '';
      const sold = hasRem ? Math.max(0, avail - Number(rem)) : null;
      let bulkSold = 0, singleSold = sold, expected = 0;
      if(sold!==null){
        if(p.bulk_enabled){
          const bsRaw = d.bulkSold[p.id];
          bulkSold = (bsRaw!==undefined && bsRaw!=='') ? Math.min(Math.max(0,Number(bsRaw)), sold) : 0;
          singleSold = sold - bulkSold;
          expected = singleSold*(p.selling_price||0) + bulkSold*(p.bulk_price||0);
        } else {
          expected = sold*(p.selling_price||0);
        }
        totalExpected += expected;
      }
      return {p, avail, rem, sold, bulkSold, singleSold, expected};
    });
    const allEntered = summaryRows.every(r=>r.sold!==null);
    const cash = parseFloat(d.cash)||0, upi = parseFloat(d.upi)||0, card = parseFloat(d.card)||0;
    const totalCollected = cash+upi+card;
    const creditGivenTotal = d.credits.reduce((a,c)=>a+(parseFloat(c.amount)||0),0);
    const totalAccounted = totalCollected + creditGivenTotal;
    const diff = totalAccounted - totalExpected;
    let status = 'MATCHED', statusClass='good';
    if(diff < -0.5){ status='SHORTAGE'; statusClass='bad'; } else if(diff > 0.5){ status='EXCESS'; statusClass='warn'; }
    return {summaryRows, totalExpected, cash, upi, card, totalCollected, creditGivenTotal, diff, status, statusClass, allEntered};
  }

  function bindClosingHandlers(){
    const main = document.getElementById('main');
    const d = state.draft;

    main.querySelectorAll('[data-remaining]').forEach(inp=>{
      inp.oninput = ()=>{ d.remaining[inp.dataset.remaining] = inp.value; patchClosing(); };
    });
    main.querySelectorAll('[data-bulk]').forEach(inp=>{
      inp.oninput = ()=>{ d.bulkSold[inp.dataset.bulk] = inp.value; patchClosing(); };
    });
    ['cash','upi','card'].forEach(key=>{
      const el = document.getElementById('in_'+key);
      if(el) el.oninput = ()=>{ d[key]=el.value; patchClosing(); };
    });
    document.getElementById('addCreditRow').onclick = ()=>{
      d.credits = d.credits || [];
      d.credits.push({credit_user_id:null, person:'', amount:''});
      document.getElementById('creditRows').innerHTML = renderCreditRows(d);
      bindCreditRowHandlers();
      scheduleDraftSave();
    };
    bindCreditRowHandlers();
    document.getElementById('cancelClosing').onclick = async ()=>{
      if(!confirm('Discard this closing in progress?')) return;
      await clearDraft(); render();
    };
    const finalizeBtn = document.getElementById('finalizeDay');
    if(finalizeBtn) finalizeBtn.onclick = finalizeClosing;
  }

  function bindCreditRowHandlers(){
    const d = state.draft;
    document.querySelectorAll('[data-credit-select]').forEach(sel=>{
      sel.onchange = ()=>{
        const i = sel.dataset.creditSelect;
        const val = sel.value;
        d.credits[i].credit_user_id = val==='__new__' ? null : val;
        const nameInput = document.querySelector(`[data-credit-newname="${i}"]`);
        if(nameInput) nameInput.style.display = val==='__new__' ? '' : 'none';
        scheduleDraftSave();
      };
    });
    document.querySelectorAll('[data-credit-newname]').forEach(inp=>{
      inp.oninput = ()=>{ d.credits[inp.dataset.creditNewname].person = inp.value; scheduleDraftSave(); };
    });
    document.querySelectorAll('[data-credit-amount]').forEach(inp=>{
      inp.oninput = ()=>{ d.credits[inp.dataset.creditAmount].amount = inp.value; patchClosing(); };
    });
    document.querySelectorAll('[data-credit-remove]').forEach(btn=>{
      btn.onclick = ()=>{
        d.credits.splice(Number(btn.dataset.creditRemove),1);
        document.getElementById('creditRows').innerHTML = renderCreditRows(d);
        bindCreditRowHandlers();
        patchClosing();
      };
    });
  }

  // Patches computed values without rebuilding input elements (fixes focus loss while typing)
  function patchClosing(){
    const d = state.draft;
    const calc = computeClosingRows(d);
    calc.summaryRows.forEach(r=>{
      const soldEl = document.getElementById('sold-'+r.p.id);
      if(soldEl) soldEl.textContent = r.sold!==null ? r.sold : '—';
      const expEl = document.getElementById('expected-'+r.p.id);
      if(expEl) expEl.textContent = fmt(r.expected);
    });
    const expectedEl = document.getElementById('stat-expected');
    if(expectedEl) expectedEl.textContent = fmt(calc.totalExpected);
    const expectedInlineEl = document.getElementById('stat-total-expected-inline');
    if(expectedInlineEl) expectedInlineEl.textContent = fmt(calc.totalExpected);
    const collectedEl = document.getElementById('stat-collected');
    if(collectedEl) collectedEl.textContent = fmt(calc.totalCollected);
    const creditGivenEl = document.getElementById('stat-creditgiven');
    if(creditGivenEl) creditGivenEl.textContent = fmt(calc.creditGivenTotal);
    const diffEl = document.getElementById('stat-diff');
    if(diffEl){ diffEl.textContent = fmt(Math.abs(calc.diff)); diffEl.className = 'value ' + calc.statusClass; }
    const badge = document.getElementById('statusBadge');
    if(badge){ badge.className = 'badge ' + calc.statusClass; badge.textContent = calc.status + (calc.status!=='MATCHED' ? ': '+fmt(Math.abs(calc.diff)) : ''); }
    const finalizeBtn = document.getElementById('finalizeDay');
    if(finalizeBtn) finalizeBtn.disabled = !calc.allEntered;

    // if sales summary needs to switch between "empty" placeholder and full table, do a scoped rebuild
    const wrap = document.getElementById('salesSummaryWrap');
    const currentlyShowingTable = wrap && wrap.querySelector('table');
    if(wrap && (calc.allEntered !== !!currentlyShowingTable)){
      wrap.innerHTML = renderSalesSummary(calc, d);
    }
    scheduleDraftSave();
  }

  async function finalizeClosing(){
    const d = state.draft;
    const calc = computeClosingRows(d);
    if(!calc.allEntered) return;
    const {data: closingRow, error: e1} = await sb.from('closings').insert({
      closing_date: d.date, total_expected: calc.totalExpected, cash: calc.cash, upi: calc.upi, card: calc.card,
      credit: calc.creditGivenTotal, total_collected: calc.totalCollected, difference: calc.diff, status: calc.status,
      closed_by: state.session.name
    }).select().single();
    if(e1){ toast('Finalize failed: '+e1.message); return; }
    const lineItems = calc.summaryRows.map(r=>({
      closing_id: closingRow.id, product_id: r.p.id, product_name: productLabel(r.p),
      available: r.avail, remaining: Number(r.rem), sold: r.sold, bulk_sold: r.bulkSold||0,
      selling_price: r.p.selling_price, expected: r.expected
    }));
    const {error: e2} = await sb.from('closing_line_items').insert(lineItems);
    if(e2){ toast('Finalize failed: '+e2.message); return; }

    const validCredits = (d.credits||[]).filter(c=>parseFloat(c.amount)>0);
    for(const c of validCredits){
      let userId = c.credit_user_id;
      if(!userId){
        const name = (c.person||'').trim() || 'Unknown';
        const {data: newUser, error: eu} = await sb.from('credit_users').insert({name}).select().single();
        if(eu){ toast('Credit user failed: '+eu.message); continue; }
        userId = newUser.id;
      }
      await sb.from('credit_transactions').insert({
        credit_user_id: userId, type:'given', amount: parseFloat(c.amount), business_date: d.date,
        closing_id: closingRow.id, status:'active', recorded_by: state.session.name
      });
    }
    for(const r of calc.summaryRows){ await sb.from('products').update({ daily_stock: Number(r.rem) }).eq('id', r.p.id); }
    await clearDraft();
    toast('Day finalized');
    await loadAll();
  }

  // ---------- EDIT PAST CLOSING (owner only, until next day's closing starts) ----------
  function openEditClosingModal(rec){
    document.getElementById('modalRoot').innerHTML = `
      <div class="overlay"><div class="modal" style="max-width:600px;">
        <h3>Edit closing — ${fmtDate(rec.date)}</h3>
        <p style="color:var(--text-dim); font-size:12.5px; margin-bottom:14px;">
          You can correct the remaining counts and today's collection here. This updates the historical record and totals,
          but will NOT retroactively change current stock levels — check Daily Inventory afterwards if adjustments are needed.
        </p>
        <div class="tablewrap"><table class="mobile-cards"><thead><tr><th>Product</th><th class="num">Available</th><th style="width:100px;">Remaining</th><th style="width:100px;">Bulk sold</th></tr></thead>
        <tbody>${rec.records.map(r=>{
          const p = productById(r.productId);
          const bulkEnabled = p && p.bulk_enabled;
          return `<tr><td data-label="Product">${r.name}</td><td class="num" data-label="Available">${r.available}</td>
            <td data-label="Remaining"><input type="number" inputmode="numeric" min="0" max="${r.available}" data-edit-remaining="${r.productId}" value="${r.remaining}"></td>
            <td data-label="Bulk sold">${bulkEnabled ? `<input type="number" inputmode="numeric" min="0" data-edit-bulk="${r.productId}" value="${r.bulkSold||0}">` : '—'}</td></tr>`;
        }).join('')}</tbody></table></div>
        <div class="grid2" style="margin-top:14px;">
          <div class="field"><label>Cash (₹)</label><input type="number" inputmode="decimal" id="edit_cash" value="${rec.cash}"></div>
          <div class="field"><label>UPI (₹)</label><input type="number" inputmode="decimal" id="edit_upi" value="${rec.upi}"></div>
        </div>
        <div class="field"><label>Card (₹)</label><input type="number" inputmode="decimal" id="edit_card" value="${rec.card}"></div>
        <p style="color:var(--text-dim); font-size:12px;">Credit given (₹${fmt(rec.credit)}) isn't edited here — manage individual credit entries from the Credit tab.</p>
        <div class="actions"><button class="btn secondary" id="cancelEdit">Cancel</button><button class="btn" id="saveEdit">Recalculate &amp; save</button></div>
      </div></div>`;
    document.getElementById('cancelEdit').onclick = closeModal;
    document.getElementById('saveEdit').onclick = async ()=>{
      let totalExpected = 0;
      const updates = [];
      for(const r of rec.records){
        const p = productById(r.productId);
        const remInput = document.querySelector(`[data-edit-remaining="${r.productId}"]`);
        const bulkInput = document.querySelector(`[data-edit-bulk="${r.productId}"]`);
        const remaining = Math.max(0, parseInt(remInput.value,10)||0);
        const sold = Math.max(0, r.available - remaining);
        let bulkSold = 0, singleSold = sold, expected;
        if(p && p.bulk_enabled){
          bulkSold = bulkInput ? Math.min(Math.max(0, parseInt(bulkInput.value,10)||0), sold) : 0;
          singleSold = sold - bulkSold;
          expected = singleSold*(p?p.selling_price:r.sellingPrice||0) + bulkSold*(p?p.bulk_price:0);
        } else {
          expected = sold*(p?p.selling_price:r.sellingPrice);
        }
        totalExpected += expected;
        updates.push({id:r.id, remaining, sold, bulkSold, expected});
      }
      const cash = parseFloat(document.getElementById('edit_cash').value)||0;
      const upi = parseFloat(document.getElementById('edit_upi').value)||0;
      const card = parseFloat(document.getElementById('edit_card').value)||0;
      const totalCollected = cash+upi+card;
      const totalAccounted = totalCollected + (rec.credit||0);
      const diff = totalAccounted - totalExpected;
      let status = 'MATCHED';
      if(diff < -0.5) status='SHORTAGE'; else if(diff > 0.5) status='EXCESS';

      for(const u of updates){
        await sb.from('closing_line_items').update({remaining:u.remaining, sold:u.sold, bulk_sold:u.bulkSold, expected:u.expected}).eq('id', u.id);
      }
      await sb.from('closings').update({
        total_expected: totalExpected, cash, upi, card, total_collected: totalCollected, difference: diff, status
      }).eq('id', rec.id);

      closeModal(); toast('Closing updated');
      await loadAll();
    };
  }

    const confirmMethod = async (method)=>{
      const {error} = await sb.from('credit_transactions').insert({
        credit_user_id: u.id, type:'repayment', amount, business_date: businessDateISO(),
        method, status:'active', recorded_by: state.session.name
      });
      if(error){ toast('Failed: '+error.message); return; }
      closeModal(); toast('Repayment recorded');
      await loadAll();
    };
    document.getElementById('method_cash').onclick = ()=>confirmMethod('cash');
    document.getElementById('method_upi').onclick = ()=>confirmMethod('upi');
  }
  function openRevertConfirm(txId, userId){
    document.getElementById('modalRoot').innerHTML = `
      <div class="overlay"><div class="modal">
        <h3>Revert payment</h3>
        <p>Are you sure you want to revert this payment? The amount will become outstanding again.</p>
        <div class="actions"><button class="btn secondary" id="rv_cancel">Cancel</button><button class="btn danger" id="rv_confirm">Revert payment</button></div>
      </div></div>`;
    document.getElementById('rv_cancel').onclick = ()=>openCreditUserModal(userId);
    document.getElementById('rv_confirm').onclick = async ()=>{
      const {error} = await sb.from('credit_transactions').update({status:'reverted', reverted_at: new Date().toISOString()}).eq('id', txId);
      if(error){ toast('Failed: '+error.message); return; }
      toast('Payment reverted');
      await loadAll();
      openCreditUserModal(userId);
    };
  }

  // ---------- REPORTS ----------
  function renderReports(){
    const main = document.getElementById('main');
    const dates = [...new Set(state.history.map(h=>h.date))].sort((a,b)=>b.localeCompare(a));
    main.innerHTML = renderTopbar() + `
      <div class="pagehead"><h1>Reports</h1><p>Historical stock and settlement records.</p></div>
      <div class="card"><h3>Daily report</h3>
        ${dates.length ? `<div class="field" style="max-width:220px;"><label>Select date</label>
          <select id="reportDate">${dates.map(d=>`<option value="${d}">${fmtDate(d)}</option>`).join('')}</select></div>
          <div id="dailyReportBody"></div>` : `<div class="empty">No finalized days yet.</div>`}
      </div>
      <div class="card"><h3>Transfer history</h3>${renderTransferHistory()}</div>
      <div class="card"><h3>Inventory report</h3>
        <div class="grid2">
          <div><h3 style="font-size:13px; color:var(--text-dim); margin-bottom:8px;">Main storage</h3>
            <div class="tablewrap">${state.products.length ? `<table class="mobile-cards"><tbody>${state.products.map(p=>`<tr><td data-label="Product">${productLabel(p)}</td><td class="num" data-label="Qty">${p.main_stock||0}</td></tr>`).join('')}</tbody></table>` : `<div class="empty">—</div>`}</div></div>
          <div><h3 style="font-size:13px; color:var(--text-dim); margin-bottom:8px;">Daily inventory</h3>
            <div class="tablewrap">${state.products.length ? `<table class="mobile-cards"><tbody>${state.products.map(p=>`<tr><td data-label="Product">${productLabel(p)}</td><td class="num" data-label="Qty">${p.daily_stock||0}</td></tr>`).join('')}</tbody></table>` : `<div class="empty">—</div>`}</div></div>
        </div>
      </div>
      <div class="card"><h3>Product sales report</h3>${renderProductSalesReport()}</div>
      <div class="card">
        <div class="row" style="justify-content:space-between; align-items:center;"><h3 style="margin:0;">Collection report</h3>
          <div class="row" style="gap:8px;"><button class="btn secondary" id="exportCollectionXlsx">Export Excel</button><button class="btn secondary" id="exportCollectionPdf">Export PDF</button></div>
        </div>
        <div class="tablewrap" style="margin-top:10px;">
        ${state.history.length ? `<table class="mobile-cards"><thead><tr><th>Date</th><th class="num">Expected</th><th class="num">Cash</th><th class="num">UPI</th><th class="num">Card</th><th class="num">Credit given</th><th class="num">Credit collected</th><th>Status</th></tr></thead>
        <tbody>${[...state.history].sort((a,b)=>b.date.localeCompare(a.date)).map(h=>{
          const cls = h.status==='MATCHED'?'good':(h.status==='SHORTAGE'?'bad':'warn');
          const cc = creditCollectedForDate(h.date);
          return `<tr><td data-label="Date">${fmtDate(h.date)}</td><td class="num" data-label="Expected">${fmt(h.totalExpected)}</td><td class="num" data-label="Cash">${fmt(h.cash)}</td><td class="num" data-label="UPI">${fmt(h.upi)}</td><td class="num" data-label="Card">${fmt(h.card)}</td><td class="num" data-label="Credit given">${fmt(h.credit)}</td><td class="num" data-label="Credit collected">${fmt(cc.total)}</td><td data-label="Status"><span class="badge ${cls}">${h.status}</span></td></tr>`;
        }).join('')}</tbody></table>` : `<div class="empty">No finalized days yet.</div>`}
        </div>
      </div>
    `;
    if(dates.length){
      const sel = document.getElementById('reportDate');
      const renderDay = ()=>{
        const rec = state.history.find(h=>h.date===sel.value);
        const cls = rec.status==='MATCHED'?'good':(rec.status==='SHORTAGE'?'bad':'warn');
        const editable = state.session.role==='owner' && closingEditableDate(rec.date);
        document.getElementById('dailyReportBody').innerHTML = `
          <div class="tablewrap"><table class="mobile-cards" style="margin-top:12px;"><thead><tr><th>Product</th><th class="num">Available</th><th class="num">Closing</th><th class="num">Sold</th><th class="num">Bulk sold</th><th class="num">Price</th><th class="num">Sales</th></tr></thead>
          <tbody>${rec.records.map(r=>`<tr><td data-label="Product">${r.name}</td><td class="num" data-label="Available">${r.available}</td><td class="num" data-label="Closing">${r.remaining}</td><td class="num" data-label="Sold">${r.sold}</td><td class="num" data-label="Bulk sold">${r.bulkSold||0}</td><td class="num" data-label="Price">${fmt(r.sellingPrice)}</td><td class="num" data-label="Sales">${fmt(r.expected)}</td></tr>`).join('')}</tbody></table></div>
          <div class="row" style="margin-top:12px;">
            <div class="stat"><div class="label">Total expected</div><div class="value">${fmt(rec.totalExpected)}</div></div>
            <div class="stat"><div class="label">Cash+UPI+Card</div><div class="value">${fmt(rec.totalCollected)}</div></div>
            <div class="stat"><div class="label">Credit given</div><div class="value warn">${fmt(rec.credit)}</div></div>
            <div class="stat"><div class="label">Status</div><div class="value ${cls}" style="font-size:16px;">${rec.status}</div></div>
          </div>
          ${rec.closedBy ? `<p style="color:var(--text-dim); font-size:12px; margin-top:10px;">Closed by ${rec.closedBy}</p>` : ''}
          <div class="row" style="margin-top:14px; gap:8px;">
            ${editable ? `<button class="btn secondary" id="editClosingBtn">Edit this closing</button>` : ''}
            <button class="btn secondary" id="exportDailyXlsx">Export Excel</button>
            <button class="btn secondary" id="exportDailyPdf">Export PDF</button>
          </div>
          ${!editable ? `<p style="color:var(--text-dim); font-size:11.5px; margin-top:8px;">Locked — a later business day's closing has already started.</p>` : ''}
        `;
        const editBtn = document.getElementById('editClosingBtn');
        if(editBtn) editBtn.onclick = ()=>openEditClosingModal(rec);
        document.getElementById('exportDailyXlsx').onclick = ()=>exportDailyReportExcel(rec);
        document.getElementById('exportDailyPdf').onclick = ()=>exportDailyReportPDF(rec);
      };
      sel.onchange = renderDay; renderDay();
    }
    const exXlsx = document.getElementById('exportCollectionXlsx');
    if(exXlsx) exXlsx.onclick = exportCollectionExcel;
    const exPdf = document.getElementById('exportCollectionPdf');
    if(exPdf) exPdf.onclick = exportCollectionPDF;
  }
  function renderTransferHistory(){
    if(!state.transferBatches.length) return `<div class="empty">No transfers recorded yet.</div>`;
    return `<div class="tablewrap"><table class="mobile-cards"><thead><tr><th>Business date</th><th>Time</th><th>User</th><th>Items</th></tr></thead>
      <tbody>${state.transferBatches.slice(0,30).map(b=>{
        const items = (b.stock_transfers||[]).map(st=>{ const p=productById(st.product_id); return `${p?productLabel(p):'—'} ×${st.quantity}`; }).join(', ');
        const t = new Date(b.created_at).toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
        return `<tr><td data-label="Business date">${fmtDate(b.business_date)}</td><td data-label="Time">${t}</td><td data-label="User">${b.created_by||'—'}</td><td data-label="Items">${items||'—'}</td></tr>`;
      }).join('')}</tbody></table></div>`;
  }
  function renderProductSalesReport(){
    if(!state.history.length) return `<div class="empty">No sales history yet.</div>`;
    const agg = {};
    state.history.forEach(h=>h.records.forEach(r=>{
      if(!agg[r.productId]) agg[r.productId]={name:r.name, qty:0, bulkQty:0, sales:0};
      agg[r.productId].qty += r.sold; agg[r.productId].bulkQty += (r.bulkSold||0); agg[r.productId].sales += r.expected;
    }));
    const rows = Object.values(agg).sort((a,b)=>b.sales-a.sales);
    if(!rows.length) return `<div class="empty">No sales history yet.</div>`;
    return `<div class="tablewrap"><table class="mobile-cards"><thead><tr><th>Product</th><th class="num">Quantity sold</th><th class="num">Bulk qty</th><th class="num">Total sales</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td data-label="Product">${r.name}</td><td class="num" data-label="Qty sold">${r.qty}</td><td class="num" data-label="Bulk qty">${r.bulkQty}</td><td class="num" data-label="Sales">${fmt(r.sales)}</td></tr>`).join('')}</tbody></table></div>`;
  }

  // ---------- EXPORTS ----------
  function exportDailyReportExcel(rec){
    const rows = rec.records.map(r=>({
      'Business Date': rec.date, 'Product': r.name, 'Available': r.available, 'Closing': r.remaining,
      'Sold': r.sold, 'Bulk Sold': r.bulkSold||0, 'Price': r.sellingPrice, 'Sales Amount': r.expected
    }));
    rows.push({});
    rows.push({'Product':'Expected Total', 'Sales Amount': rec.totalExpected});
    rows.push({'Product':'Cash', 'Sales Amount': rec.cash});
    rows.push({'Product':'UPI', 'Sales Amount': rec.upi});
    rows.push({'Product':'Card', 'Sales Amount': rec.card});
    rows.push({'Product':'Credit Given', 'Sales Amount': rec.credit});
    rows.push({'Product':'Settlement Status', 'Sales Amount': rec.status});
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Daily Report');
    XLSX.writeFile(wb, `Pegg-daily-report-${rec.date}.xlsx`);
  }
  function exportDailyReportPDF(rec){
    const doc = new window.jspdf.jsPDF();
    doc.setFontSize(14); doc.text(`Pegg — Daily Report — ${rec.date}`, 14, 16);
    doc.autoTable({
      startY: 22,
      head: [['Product','Available','Closing','Sold','Bulk Sold','Price','Sales']],
      body: rec.records.map(r=>[r.name, r.available, r.remaining, r.sold, r.bulkSold||0, fmt(r.sellingPrice), fmt(r.expected)])
    });
    const y = doc.lastAutoTable.finalY + 8;
    doc.autoTable({
      startY: y,
      head: [['Summary','Value']],
      body: [
        ['Expected Total', fmt(rec.totalExpected)], ['Cash', fmt(rec.cash)], ['UPI', fmt(rec.upi)],
        ['Card', fmt(rec.card)], ['Credit Given', fmt(rec.credit)], ['Status', rec.status]
      ]
    });
    doc.save(`Pegg-daily-report-${rec.date}.pdf`);
  }
  function exportCollectionExcel(){
    const rows = [...state.history].sort((a,b)=>a.date.localeCompare(b.date)).map(h=>{
      const cc = creditCollectedForDate(h.date);
      return {'Date':h.date,'Expected':h.totalExpected,'Cash':h.cash,'UPI':h.upi,'Card':h.card,'Credit Given':h.credit,'Credit Collected':cc.total,'Status':h.status};
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Collection Report');
    XLSX.writeFile(wb, `Pegg-collection-report.xlsx`);
  }
  function exportCollectionPDF(){
    const doc = new window.jspdf.jsPDF();
    doc.setFontSize(14); doc.text('Pegg — Collection Report', 14, 16);
    doc.autoTable({
      startY: 22,
      head: [['Date','Expected','Cash','UPI','Card','Credit Given','Credit Collected','Status']],
      body: [...state.history].sort((a,b)=>a.date.localeCompare(b.date)).map(h=>{
        const cc = creditCollectedForDate(h.date);
        return [h.date, fmt(h.totalExpected), fmt(h.cash), fmt(h.upi), fmt(h.card), fmt(h.credit), fmt(cc.total), h.status];
      })
    });
    doc.save('Pegg-collection-report.pdf');
  }

  // ---------- USERS ----------
  function renderUsers(){
    const main = document.getElementById('main');
    main.innerHTML = renderTopbar() + `
      <div class="pagehead"><h1>Users</h1><p>Owner has full access. Manager access is limited to daily operations.</p></div>
      <div class="card">
        <div class="row" style="justify-content:space-between; align-items:center;"><h3 style="margin:0;">Accounts</h3><button class="btn" id="addUserBtn">Add user</button></div>
        <div class="tablewrap" style="margin-top:14px;"><table class="mobile-cards"><thead><tr><th>Name</th><th>Username</th><th>Role</th><th></th></tr></thead>
          <tbody>${state.users.map(u=>`
            <tr><td data-label="Name">${u.name}</td><td data-label="Username">${u.username}</td><td data-label="Role">${roleLabel(u.role)}</td>
              <td data-label="" style="text-align:right; white-space:nowrap;">
                <button class="iconbtn" data-edituser="${u.id}">Edit</button>
                ${u.id!==state.session.id ? `<button class="iconbtn danger" data-deluser="${u.id}">Delete</button>` : ''}
              </td></tr>`).join('')}
          </tbody></table></div>
      </div>
    `;
    document.getElementById('addUserBtn').onclick = ()=>openUserModal(null);
    main.querySelectorAll('[data-edituser]').forEach(b=>b.onclick=()=>openUserModal(b.dataset.edituser));
    main.querySelectorAll('[data-deluser]').forEach(b=>b.onclick=()=>deleteUser(b.dataset.deluser));
  }
  function openUserModal(id){
    const u = id ? state.users.find(x=>x.id===id) : {id:null, name:'', username:'', pin:'', role:'manager'};
    document.getElementById('modalRoot').innerHTML = `
      <div class="overlay"><div class="modal">
        <h3>${id ? 'Edit user' : 'Add user'}</h3>
        <div class="field"><label>Name</label><input type="text" id="u_name" value="${u.name}"></div>
        <div class="field"><label>Username</label><input type="text" id="u_username" value="${u.username}"></div>
        <div class="field"><label>PIN ${id ? '(leave blank to keep current)' : ''}</label><input type="password" id="u_pin" inputmode="numeric"></div>
        <div class="field"><label>Role</label><select id="u_role">
          <option value="manager" ${u.role==='manager'?'selected':''}>Manager</option>
          <option value="owner" ${u.role==='owner'?'selected':''}>Owner</option></select></div>
        <div class="err" id="u_err"></div>
        <div class="actions"><button class="btn secondary" id="cancelBtn">Cancel</button><button class="btn" id="saveBtn">Save user</button></div>
      </div></div>`;
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('saveBtn').onclick = async ()=>{
      const name = document.getElementById('u_name').value.trim();
      const username = document.getElementById('u_username').value.trim().toLowerCase();
      const pin = document.getElementById('u_pin').value.trim();
      const role = document.getElementById('u_role').value;
      const errEl = document.getElementById('u_err');
      if(!name || !username){ errEl.textContent = 'Name and username are required.'; return; }
      const dupe = state.users.find(x=>x.username===username && x.id!==u.id);
      if(dupe){ errEl.textContent = 'That username is already taken.'; return; }
      if(!id && pin.length<4){ errEl.textContent = 'Set a PIN of at least 4 digits.'; return; }
      if(pin && pin.length<4){ errEl.textContent = 'PIN must be at least 4 digits.'; return; }
      const payload = {name, username, role};
      if(pin) payload.pin = pin;
      let error, data;
      if(id){ ({error} = await sb.from('app_users').update(payload).eq('id', id)); data = {...u, ...payload}; }
      else { payload.pin = pin; ({data, error} = await sb.from('app_users').insert(payload).select().single()); }
      if(error){ errEl.textContent = error.message; return; }
      if(id===state.session.id) state.session = {...state.session, ...payload};
      closeModal(); toast('User saved');
      await loadAll();
    };
  }
  async function deleteUser(id){
    if(!confirm('Remove this user account?')) return;
    const {error} = await sb.from('app_users').delete().eq('id', id);
    if(error){ toast('Delete failed: '+error.message); return; }
    await loadAll();
  }

  // ---------- RENDER DISPATCH ----------
  function render(){
    if(NOT_CONFIGURED){ renderNotConfigured(); return; }
    if(state.loading){ document.getElementById('app').innerHTML = `<div class="authwrap"><div style="color:var(--text-dim);">Loading…</div></div>`; return; }
    if(!state.users.length){ renderSetup(); return; }
    if(!state.session){ renderLogin(); return; }
    renderShell(); renderNav();
    const allowed = visibleTabs().map(t=>t.id);
    if(!allowed.includes(state.tab)) state.tab = allowed[0];
    switch(state.tab){
      case 'dashboard': renderDashboard(); break;
      case 'products': renderProducts(); break;
      case 'mainstorage': renderMainStorage(); break;
      case 'transfer': renderTransfer(); break;
      case 'dailyinv': renderDailyInv(); break;
      case 'closing': renderClosing(); break;
      case 'credit': renderCredit(); break;
      case 'reports': renderReports(); break;
      case 'users': renderUsers(); break;
    }
  }

  if(NOT_CONFIGURED){ render(); } else { loadAll(); }

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
